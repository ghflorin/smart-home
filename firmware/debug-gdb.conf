# Variant for debugging with gdb.
#
# The production build has LTO on so the image fits into the 710K slot together
# with a second slot for OTA. The side effect: LTO dissolves function
# boundaries, and gdb can no longer put a breakpoint on AppTask::Init or
# LightCtrl::Init - "info functions" does not find them at all.
#
# Usage:
#     ./scripts/build.sh holyiot_25008 -DEXTRA_CONF_FILE=debug-gdb.conf
# Do NOT put this on a production board: the image grows and busts the OTA
# budget.
CONFIG_LTO=n
CONFIG_DEBUG_THREAD_INFO=y
