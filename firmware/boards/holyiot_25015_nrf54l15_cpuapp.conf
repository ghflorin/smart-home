# Configuration specific to the Holyiot 25015 module (nRF54L15 + LIS2DH + SHT40).
#
# The accelerometer driver is enabled here, not in prj.conf: CONFIG_LIS2DH
# depends on DT_HAS_ST_LIS2DH_ENABLED, and the node exists only on the boards
# that actually carry the sensor. See HAS_ACCEL in src/automation.cpp.

# SPI stays on so the CS lines are held inactive; the sensor is powered down
# from the overlay. See the comment there.
CONFIG_SPI=y
# CONFIG_LIS2DH=y
# CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

# Multirole is the only role SoftDevice supports on nRF54L.
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y

# On nRF54L15 settings go to ZMS, not NVS.
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=512
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_NVS=n

CONFIG_POWEROFF=y

# Factory data off on the Holyiot module (MCUboot is now ON, for OTA).
#
# The module has no pm_static with a factory_data partition, and without OTA
# there is no point in a bootloader that eats 64K of RRAM. The reference project
# uAmpHome/micro_matter_button does the same.
#
# CONSEQUENCE: the device uses the test Matter credentials compiled into the
# firmware (VID 0xFFF1 / PID 0x8004), not per-unit ones. Acceptable for a DIY
# device in your own fabric, but NOT for distribution.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n

# ---------------- OTA ----------------
# Two image slots have to fit into 1524 KB of RRAM. The image with logging is
# 766 KB and does NOT fit; with the optimizations below it drops to ~610 KB.
#
# Logging can go without losing anything: the module has no console in
# devicetree (neither UART nor RTT enabled), so the logs went nowhere anyway.
# For debugging use the nrf54l15dk, which does have a console.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
# NCS replaces BOOT_BANNER with NCS_BOOT_BANNER, and that is the one doing
# 'select PRINTK'. Set on the wrong symbol, printk stayed compiled in.
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_ASSERT=n

# ---------------- Idle power ----------------
# The module is a Sleepy End Device: it polls its Thread parent periodically,
# and that poll IS the keep-alive that holds the attachment. It happens whether
# or not you press the button, so the device never detaches "from inactivity".
#
# The Matter default for SIT is 1000 ms - chosen conservatively for devices that
# have to RECEIVE commands quickly (locks, valves). For a switch, which almost
# only sends, that is waste: ~2.4 million wakeups a month.
#
# 15000 is the maximum the spec allows for the SIT class (9.16.1.5; see also
# CHIP_ICD_SIT_SLOW_POLL_LIMIT, whose range is 0..15000). Fifteen times fewer
# wakeups, and anything inbound - AnnounceOTAProvider included - is delayed by
# at most 15 s.
#
# It stays below OPENTHREAD_MLE_CHILD_TIMEOUT (240 s), so OpenThread does not
# clamp it: the effective poll is min(requested, child_timeout - margin).
#
# For even lower power, move to the LIT class (snippets/lit_icd, 5 min poll) -
# but then the child timeout has to be raised above 300 s as well.
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=15000

# The SHT40 temperature/humidity sensor is enabled by the board's _defconfig
# (inherited from the reference repo, which reported it to the smart home). We
# do not use it, so we turn it off - same reasoning as for the accelerometer.
CONFIG_SHT4X=n

# The console on UART20 (P1.04/P1.05) exists in devicetree, but we keep it OFF.
# With it and logging enabled, the image no longer fits into two OTA slots. For
# a debug build, set these to y and run two wires out.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
