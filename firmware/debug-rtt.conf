# Debug console over SWD, through RTT.
#
# The module has no USB, and UART would need two extra wires on 1.5 mm pads.
# RTT runs over the SWD link that already exists for flashing: zero wires.
#
# NOT part of the production build. Two things to know before using it, both
# learned by bricking a switch with it:
#
# 1. THIS PROFILE DOES NOT CURRENTLY FIT, AND WE DO NOT KNOW THE EXACT CEILING.
#    Measured on holyiot_25008, same signing key throughout:
#
#        642076 B  no RTT              boots
#        714880 B  RTT + battery       MCUboot rejects it
#        720048 B  RTT, no battery     MCUboot rejects it
#        722288 B  RTT + battery       MCUboot rejects it
#
#    Rejected means `FIH_PANIC` in main.c:611 - no bootable image - with the PC
#    frozen around 0x5230 and a switch that does nothing until it is reflashed.
#    imgtool passes all of these: it checks `image + trailer <= slot` against a
#    fixed 6224-byte trailer. MCUboot's own swap status area is not fixed - it
#    grows with the sector count, and this slot is 177 sectors - which is the
#    likely reason, though it has not been proven.
#
#    So the real ceiling is somewhere between 642 KB and 714 KB. Until somebody
#    measures it, treat anything much above 642 KB as unproven, and check what
#    you built before flashing it:
#       ls -l build-*/firmware/zephyr/zephyr.signed.bin
#
# 2. USE A SEPARATE BUILD DIRECTORY. EXTRA_CONF_FILE lands in the CMake cache
#    and every later build in that directory inherits it silently - including
#    the one you build to undo it. An image that should have been 87% came out
#    at 98.7% and would not boot either. `rm -rf` the build directory, or use
#    -d for a directory of its own.
#
#     ./scripts/build.sh holyiot_25008 -DEXTRA_CONF_FILE=debug-rtt.conf
# and read with, giving the address from the ELF because the default search
# range does not find it on this part:
#     nm build-*/firmware/zephyr/zephyr.elf | grep _SEGGER_RTT
#     pyocd rtt -t nrf54l -a 0x20000040 -s 0x100
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
# Minimal, not deferred: deferred logging carries a whole processing thread and
# its buffers, and this profile has to fit in what the application leaves of a
# 710 KB slot. Minimal goes straight out through printk, which is all a crash
# investigation needs.
CONFIG_LOG_MODE_MINIMAL=y

# What we care about is application and Matter stack startup, not all the noise.
CONFIG_SMARTHOME_LOG_LEVEL=4
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_APP_LOG_LEVEL=4
