# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
# 32772 == 0x8004 (example light-switch-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32772
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# We drive the RGB LED ourselves, with PWM (src/status_led.cpp).
CONFIG_PWM=y

# The ADC, for reading the coin cell through the chip's own AVDD input. The
# devicetree node alone is not enough - without this the driver is never built
# and the link fails on adc_gain_invert. See the &adc block in boards/*.overlay.

# The common LED module from NCS is off: it drives the LEDs as GPIO on/off for
# network state, and would fight our PWM over the same pins. We signal state
# through color, not through which-of-four-LEDs.
CONFIG_NCS_SAMPLE_MATTER_LEDS=n

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterSwitch"

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
# Reboot instead of freezing. The module has no console in this build
# (CONFIG_SERIAL is off so two OTA slots fit), and Zephyr's default handler
# masks interrupts and drops into for(;;) - i.e. the board dies silently, the
# LED frozen on the last color written, unresponsive to everything until you
# pull the battery. That is exactly how the dangling reference in
# light_ctrl.cpp presented. A silent fault on a device with no console is the
# worst possible way to fail.
# prj_release.conf already has y; there is no reason for the working build to
# be more fragile than the production one.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# ---------------- SmartHome ----------------
# The name that appears while commissioning over Bluetooth. Overrides the
# sample's value above.
#
# FOURTEEN CHARACTERS, maximum. hci_core.c asserts
# DEVICE_NAME_LEN < CONFIG_BT_DEVICE_NAME_MAX, and that ceiling is 15 here - so
# a 15-character name fails the build, deep inside Zephyr's Bluetooth host,
# with `static assertion failed: ""` and no mention of this line.
CONFIG_BT_DEVICE_NAME="SmartSwitch"

# Accelerometer: the concrete driver is enabled in boards/<board>.conf, because
# CONFIG_LIS2DH depends on DT_HAS_ST_LIS2DH_ENABLED. On nrf54l15dk there is no
# sensor, so the gestures compile out (see HAS_ACCEL in automation.cpp).
CONFIG_SENSOR=y

# Time synchronization. Off by default: on battery it costs wakeups. Enable with
# -DCONFIG_SMARTHOME_SNTP=y if the Border Router has internet access.
# CONFIG_SMARTHOME_SNTP=y
