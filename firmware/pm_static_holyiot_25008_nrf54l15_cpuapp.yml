# Partition map, Holyiot 25008 module (nRF54L15, 1524 KB RRAM).
#
# PINNED ON PURPOSE. The partition manager would compute this itself, but then
# it would move on every configuration change - and if settings_storage moves,
# the device loses its Matter commissioning (fabric, ACL, binding table) and has
# to be re-paired with the bulbs. This file anchors it.
#
# RULE: settings_storage and factory_data NEVER move. If you need more room for
# the application, shrink the slots, not the tail.
#
#   0x000000  mcuboot              56 KB
#   0x00E000  mcuboot_pad           2 KB   ┐ mcuboot_primary
#   0x00E800  app                 710 KB   ┘  712 KB
#   0x0C0000  mcuboot_secondary   712 KB
#   0x172000  factory_data          4 KB   (reserved, currently unused)
#   0x173000  settings_storage     40 KB
#   0x17D000  = 1524 KB
#
# Both slots live in internal RRAM - the module has no external flash.
# The optimized image is ~610 KB, so ~100 KB of headroom is left per slot.

mcuboot:
  address: 0x0
  end_address: 0xe000
  region: flash_primary
  size: 0xe000

mcuboot_pad:
  address: 0xe000
  end_address: 0xe800
  region: flash_primary
  size: 0x800

app:
  address: 0xe800
  end_address: 0xc0000
  region: flash_primary
  size: 0xb1800

mcuboot_primary:
  address: 0xe000
  end_address: 0xc0000
  region: flash_primary
  size: 0xb2000
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001

mcuboot_primary_app:
  address: 0xe800
  end_address: 0xc0000
  region: flash_primary
  size: 0xb1800
  orig_span: &id002
  - app
  span: *id002

mcuboot_secondary:
  address: 0xc0000
  end_address: 0x172000
  region: flash_primary
  size: 0xb2000

# Reserved so that no remap is needed if you want per-unit Matter credentials
# instead of the test ones.
factory_data:
  address: 0x172000
  end_address: 0x173000
  region: flash_primary
  size: 0x1000

settings_storage:
  address: 0x173000
  end_address: 0x17d000
  region: flash_primary
  size: 0xa000
