<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smarthome</title>
<script>
/* The theme is resolved BEFORE the first paint, otherwise you get a flash of
 * the wrong theme on every load. That is why this script is inline in the head
 * and not in the big block at the end of the page.
 *
 * localStorage holds the preference (auto|light|dark). On <html> we set the
 * EFFECTIVE theme (light|dark), so the CSS has only two palettes and no media
 * query - "auto" is resolved here, and we keep listening for system changes for
 * as long as the preference is auto. */
(function () {
  var mq = matchMedia("(prefers-color-scheme: light)");
  var pref = "auto";
  try { pref = localStorage.getItem("theme") || "auto"; } catch (e) {}

  function apply() {
    var eff = pref === "auto" ? (mq.matches ? "light" : "dark") : pref;
    document.documentElement.dataset.theme = eff;
  }
  function reresolve() { if (pref === "auto") { apply(); } }

  /* The normal case: the system announces the change and we catch it at once. */
  mq.addEventListener("change", reresolve);
  /* Safety net: the panel stays open for hours, and the event above does not
   * arrive everywhere (some webviews and emulation tools only change the media
   * query result, without notifying). We re-evaluate when the page becomes
   * visible again or gets focus - practically free. */
  document.addEventListener("visibilitychange", reresolve);
  window.addEventListener("focus", reresolve);

  window.themePref = function () { return pref; };
  window.setThemePref = function (p) {
    pref = p;
    try { localStorage.setItem("theme", p); } catch (e) {}
    apply();
  };
  apply();
})();
</script>
<style>
  /* ---------- palette ----------
   * Everything colored on the page goes through these variables. If you add
   * hardcoded colors below, the light theme breaks silently. For accent shades
   * use color-mix on --amber / --link, so they adjust themselves when the
   * palette changes. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #0a0b0d;
    --panel:     #101317;
    --panel-hi:  #161a1f;
    --line:      #1f242b;
    --line-hi:   #2b323b;
    --ink:       #dfe3e8;
    --ink-dim:   #707886;
    --ink-faint: #454c57;
    --amber:     #ffa726;
    --amber-hot: #ffcc66;
    --link:      #45c4b0;
    --bad:       #e5534b;

    --sunken:    #08090b;  /* inputs, pre - deeper than the panel */
    --sunken-hi: #0c0e11;
    --scrim:     rgba(4,5,6,.88);
    --ring:      rgba(255,255,255,.03);
    --on-amber:  #1a1205;  /* text on an amber background */
    --on-link:   #04110f;
    --lit:       color-mix(in srgb, var(--amber) 19%, transparent);  /* the level fill */
    /* The same colour the fill RESOLVES to over the plot ground, but opaque.
       --lit is translucent, so painting a shape with it lets the ground through
       and doubles up where it overlaps the fill. */
    --lit-solid: color-mix(in srgb, var(--amber) 19%, var(--sunken));
    --grid:      .35;      /* silkscreen opacity */
  }

  /* Light theme: not the dark one inverted, it is "printed datasheet" - warm
   * paper, dark accents so they stay legible on white. The amber and teal from
   * the dark theme have too little contrast on a light background, so they get
   * darker. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:        #f3f1ec;
    --panel:     #ffffff;
    --panel-hi:  #faf8f4;
    --line:      #e0dcd3;
    --line-hi:   #c6c0b5;
    --ink:       #16191d;
    --ink-dim:   #5c636d;
    --ink-faint: #8b929c;
    --amber:     #9c5a06;
    --amber-hot: #7a4504;
    --link:      #0c7a6b;
    --bad:       #b8352b;

    --sunken:    #edeae3;
    --sunken-hi: #e6e2d9;
    --scrim:     rgba(28,25,20,.62);
    --ring:      rgba(0,0,0,.05);
    --on-amber:  #fff4e4;
    --on-link:   #eafaf7;
    --lit:       color-mix(in srgb, var(--amber) 24%, transparent);
    --lit-solid: color-mix(in srgb, var(--amber) 24%, var(--sunken));
    --grid:      .5;
  }

  :root {
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono",
            "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* fine grid, like a PCB silkscreen */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: var(--grid);
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
  }

  .wrap {
    position: relative;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-hi);
    margin-bottom: 32px;
  }
  /* Title and status on two lines, as a column of their own; the theme icon
   * stays on the right, centered on the full height. */
  .brand {
    display: grid;
    gap: 6px;
    justify-items: start;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  h1 .dot { color: var(--amber); }

  /* The title is the way back.
   *
   * From a bulb's sheet or the schedule page there was no way home except the
   * control you happened to arrive by, and the one thing every interface has
   * trained people to click is the name in the corner. */
  .home {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .home:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; border-radius: 4px; }

  .logo { width: 21px; height: 21px; flex: none; display: block; }
  .logo .lgline {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linejoin: round;
  }
  .logo .lglit  { fill: var(--lit); }
  .logo .lgedge { fill: color-mix(in srgb, var(--amber) 55%, transparent); }
  /* Hover raises the light in the house. The mark is a level in a container,
     which is what every tile on the page is; making it move is the shortest
     way to say the two are the same idea. */
  .logo .lglit, .logo .lgedge { transition: y .4s cubic-bezier(.3,0,.2,1); }
  .home:hover .logo .lglit  { y: 8.2; }
  .home:hover .logo .lgedge { y: 7.8; }
  @media (prefers-reduced-motion: reduce) {
    .logo .lglit, .logo .lgedge { transition: none; }
  }
  /* The status sits under the title, where the subtitle used to be. */
  #status {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    box-shadow: 0 0 0 3px var(--ring);
  }
  #status.ok::before  { background: var(--link); box-shadow: 0 0 10px var(--link); }
  #status.err::before  { background: var(--bad);   box-shadow: 0 0 10px var(--bad); }
  #status.warn::before { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

  /* ---------- theme selector ----------
   * A single button that cycles auto -> day -> night. The icon is one SVG with
   * three moving pieces, not three icons swapped for one another:
   *   .rays  - the sun rays; they pull in and rotate only for night
   *   .carve - a black circle in the mask; moving it over the disc carves out
   *            the crescent moon
   *   .split - a rectangle in the mask; it covers the right half for auto
   *   .ring  - the full outline, visible only on auto, so you can see the disc
   *            is halved and not merely smaller
   * Because these are pieces that translate, the transition is continuous: the
   * sun really turns into the moon, it does not blink from one to the other. */
  #theme { align-self: center; display: flex; }
  .hdr-acts { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .hact {
    font: inherit;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line-hi);
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .hact:hover { color: var(--link); border-color: var(--link); }
  .hact.on {
    color: var(--link);
    border-color: var(--link);
    background: color-mix(in srgb, var(--link) 12%, transparent);
  }
  .hact.add {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
    letter-spacing: 0;
    line-height: 1;
    display: grid;
    place-items: center;
  }

  /* The three ways to add something, asked once instead of standing as three
     permanent buttons. Each says what it is and what it is for, because
     "device" and "switch" only look different to somebody who already knows. */
  .choices { display: grid; gap: 10px; margin-top: 6px; }
  .choice {
    display: grid;
    gap: 5px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line-hi);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .choice:hover {
    border-color: var(--link);
    background: color-mix(in srgb, var(--link) 8%, transparent);
  }
  .choice b { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .choice span { font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
  #theme button {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  #theme button:hover {
    color: var(--amber);
    background: color-mix(in srgb, var(--amber) 9%, transparent);
  }
  #theme button:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: -1px;
  }
  #theme svg { width: 20px; height: 20px; display: block; }

  /* All the pieces rotate around the same center, otherwise the movement comes
   * out crooked. transform-box: view-box makes the px in transform be viewBox
   * units. */
  .tsw .rays, .tsw .carve, .tsw .split {
    transform-box: view-box;
    transform-origin: 12px 12px;
  }
  .tsw .rays  { transition: transform .5s cubic-bezier(.34,1.5,.5,1), opacity .28s ease; }
  .tsw .carve { transition: transform .45s cubic-bezier(.5,.05,.2,1); }
  .tsw .split { transition: transform .45s cubic-bezier(.5,.05,.2,1); }
  .tsw .ring  { transition: opacity .3s ease .1s; }

  /* day: a whole sun - full disc, rays extended */
  .tsw[data-state="light"] .rays  { opacity: 1; transform: rotate(0deg) scale(1); }
  .tsw[data-state="light"] .carve { transform: translate(0, 0); }
  .tsw[data-state="light"] .split { transform: translate(15px, 0); }
  .tsw[data-state="light"] .ring  { opacity: 0; }

  /* night: the rays pull in and rotate, the circle in the mask moves in and
   * carves the crescent. The disc radius does not change, so the sun really
   * turns into the moon. */
  .tsw[data-state="dark"] .rays  { opacity: 0; transform: rotate(-50deg) scale(.35); }
  .tsw[data-state="dark"] .carve { transform: translate(-8.5px, 9.5px); }
  .tsw[data-state="dark"] .split { transform: translate(15px, 0); }
  .tsw[data-state="dark"] .ring  { opacity: 0; }

  /* auto: half a disc, but with the rays in place - exactly the automatic
   * brightness symbol from a phone, so it needs no explaining. */
  .tsw[data-state="auto"] .rays  { opacity: 1; transform: rotate(0deg) scale(1); }
  .tsw[data-state="auto"] .carve { transform: translate(0, 0); }
  .tsw[data-state="auto"] .split { transform: translate(0, 0); }
  .tsw[data-state="auto"] .ring  { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .tsw .rays, .tsw .carve, .tsw .split, .tsw .ring { transition: none; }
  }

  /* ---------- sections ---------- */
  .section-label {
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 34px 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label .rule {
    flex: 1;
    height: 1px;
    background: var(--line-hi);
  }

  /* ---------- the tile grid ----------
   * Tiles, not a column of cards. Two reasons, and neither is fashion.
   *
   * A house has more devices than fit one per row, and a column wastes the
   * whole right half of the screen to show a node ID nobody reads. What you
   * want from across the room is which lights are on - that is state, and state
   * reads better as a wall of small things than as a list of large ones.
   *
   * Each tile does two jobs, split the way HomeKit splits them: the round icon
   * is the quick action (toggle the bulb, lock the switch), and everywhere else
   * on the tile opens its settings. That split is worth stating because it is
   * not discoverable by looking - hence the cursor and the hover ring on the
   * icon, and the title on both halves.
   *
   * Rounded corners appear here and nowhere else on the page. The rest of the
   * panel is deliberately square, PCB silkscreen; the tiles are the one place
   * we borrow the phone idiom, because that is the thing being imitated.
   */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
  }

  .grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
  }
  /* The three sizes are not one shape scaled. "s" is a row - icon beside the
   * text - because below about 150px a square has no room for a name. "m" and
   * "l" are squares, icon above, text anchored to the bottom edge. */
  .grid[data-size="s"] { --tile: 208px; --ico: 38px; }
  .grid[data-size="m"] { --tile: 158px; --ico: 44px; }
  .grid[data-size="l"] { --tile: 226px; --ico: 54px; }

  .tile {
    position: relative;
    overflow: hidden;              /* the level fill is clipped by the rounded edge */
    border: 1px solid var(--line-hi);
    border-radius: 12px;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
    padding: 14px;
    display: grid;
    gap: 12px;
    cursor: pointer;
    transition: border-color .15s, background .3s, transform .12s;
    /* A tile is a control, not prose. Without this, pressing one and dragging
       paints a text selection across half the page before the drag even
       arms - and the selection outlives the drop. */
    user-select: none;
    -webkit-user-select: none;
  }
  /* Only on a tile's first appearance. Left on the element permanently it would
     replay every time the tile moves between rooms, because inserting a node
     restarts its CSS animations. */
  .tile.fresh { animation: rise .4s cubic-bezier(.2,.7,.3,1) backwards; }
  /* Everything readable sits above the fill. The badge only gets the z-index -
     giving it position:relative would undo the absolute corner it lives in. */
  .tile > .quick, .tile > .tmeta { position: relative; z-index: 1; }
  .tile > .tbadge { z-index: 1; }
  .grid[data-size="s"] .tile {
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 14px;
  }
  .grid[data-size="m"] .tile,
  .grid[data-size="l"] .tile {
    grid-template-rows: auto 1fr;
    aspect-ratio: 1 / 1;
  }
  .grid[data-size="m"] .tmeta,
  .grid[data-size="l"] .tmeta { align-self: end; }

  .tile:hover { transform: translateY(-1px); border-color: var(--line-hi); }
  .tile:focus-visible { outline: 1px solid var(--link); outline-offset: 2px; }

  /* On: the tile itself carries the state, not a word in a corner. This is the
   * thing you read from the doorway. */
  .tile.on { border-color: color-mix(in srgb, var(--amber) 42%, transparent); }

  /* ---------- the level ----------
   * The amber is not decoration: the tile fills from the bottom to the bulb's
   * brightness, so a row of tiles reads as a row of levels with no numbers
   * being compared. A wash that only said "on" wasted the one channel that
   * could carry the value for free.
   *
   * The fill is FLAT and its top edge is a hairline. Height is the only thing
   * that varies, which is what makes it a measurement you can read across the
   * room instead of a texture - shading it would add a second gradient that
   * means nothing, and blur the very edge that carries the value. */
  .tile .fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(var(--lvl) * 100%);
    background: var(--lit);
    border-top: 1px solid color-mix(in srgb, var(--amber) 55%, transparent);
    pointer-events: none;
    /* Slow, because it is the bulb catching up, not the interface reacting. */
    transition: height .55s cubic-bezier(.3,0,.2,1);
  }
  /* Full: the hairline has nothing above it left to separate, so it reads as a
     stray rule along the edge instead of as a level. */
  .tile .fill.full { border-top-color: transparent; }

  /* Both fills get a compositing layer of their own.
   *
   * The horizontal bands reported across a tile are repaint residue, not
   * elements: there is exactly one .fill per tile and one .hk-fill per sheet,
   * and the surfaces behind them are opaque, so nothing can be showing
   * through. What is left is the fill itself - a 24%-alpha box whose HEIGHT
   * animates inside a rounded overflow:hidden clip. A renderer that composites
   * each frame over the last instead of replacing it leaves a band at every
   * intermediate height, and they accumulate for as long as the value keeps
   * moving - which is why they showed up while the Thread radio was down and
   * the level was flapping. On its own layer the frame is replaced.
   *
   * Not reproducible in Chromium, so this is the remedy for the class of bug
   * rather than a fix confirmed against the artefact. */
  .tile .fill, .hk-fill {
    transform: translateZ(0);
    will-change: height;
  }
  /* Their clips become stacking contexts to match, so a composited child
     cannot paint outside the rounded corner it belongs to. */
  .tile, .hk-lvl { isolation: isolate; }

  /* Unknown is not off. A bulb that did not answer must not look like a bulb
   * that is switched off - you would walk over and press a switch that is
   * already in the right position. */
  .tile.unknown { border-style: dashed; }
  .tile.unknown .tstate { color: var(--ink-faint); }

  .tile .quick {
    width: var(--ico);
    height: var(--ico);
    border-radius: 50%;
    border: 1px solid var(--line-hi);
    background: var(--sunken);
    color: var(--ink-dim);
    display: grid;
    place-items: center;
    padding: 0;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
  }
  .tile .quick svg { width: 55%; height: 55%; display: block; }
  .tile .quick:hover:not(:disabled) {
    color: var(--ink);
    border-color: var(--ink-faint);
  }
  .tile .quick:disabled { opacity: .5; cursor: default; }
  .tile.on .quick {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--on-amber);
    box-shadow: 0 0 18px color-mix(in srgb, var(--amber) 35%, transparent);
  }
  /* A command is in flight: the switch can be asleep for up to its poll
   * interval, so "nothing happened yet" needs to look deliberate. */
  .tile .quick.busy { animation: beacon 1s ease-in-out infinite; }
  .tile .quick.failed {
    color: var(--bad);
    border-color: var(--bad);
    background: color-mix(in srgb, var(--bad) 14%, transparent);
  }

  .tname {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .tstate {
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  /* Amber text on an amber fill is the one combination that stops reading, and
     it is exactly the one that happens at high brightness. The hot shade keeps
     it apart from the surface it sits on. */
  .tile.on .tstate { color: var(--amber-hot); }
  /* The bulb's actual light colour. Small on purpose: it is a qualifier on the
     brightness beside it, not a second headline. */
  .tstate .cdot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: none;
    margin-right: 6px;
    vertical-align: 1px;
    box-shadow: 0 0 0 1px var(--ring);
  }

  /* Top right: the things that are true of the device regardless of what it is
   * doing - its role, or that it is locked. In the square layouts it lands
   * beside the icon, in the row layout it lands on top of the name - hence the
   * reserved space. */
  .grid[data-size="s"] .tile.badged .tname { padding-right: 46px; }
  .tbadge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 8px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    border-radius: 6px;
    padding: 2px 6px;
  }


  /* ---------- the toolbar: rooms on the left, tile size on the right ------ */
  .toolbar {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 26px;
  }
  .toolbar .rooms { margin-bottom: 0; flex: 1; }
  .sizer { display: flex; gap: 6px; flex: none; }
  .sizer button {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    background: transparent;
    border: 1px solid var(--line-hi);
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0;
    transition: color .15s, border-color .15s;
  }
  .sizer button:hover { color: var(--ink); }
  .sizer button.on { color: var(--link); border-color: var(--link); }
  .sizer svg { width: 14px; height: 14px; display: block; }

  /* ---------- identify button ---------- */
  button.id {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--amber);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--amber) 32%, transparent);
    padding: 10px 18px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  button.id:hover:not(:disabled) {
    background: color-mix(in srgb, var(--amber) 10%, transparent);
    border-color: var(--amber);
    color: var(--amber-hot);
  }
  button.id:active:not(:disabled) { transform: translateY(1px); }

  /* Quiet until it is armed, then unmistakable. A destructive control that
     shouts before you have asked for it just gets clicked past. */
  button.forget {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line-hi);
    padding: 10px 18px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  button.forget:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  button.forget.armed {
    color: var(--bad);
    border-color: var(--bad);
    background: color-mix(in srgb, var(--bad) 12%, transparent);
  }
  button.forget:active:not(:disabled) { transform: translateY(1px); }
  button.forget:disabled { cursor: default; opacity: .6; }
  .forget-note {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-dim);
    margin-top: 10px;
  }
  .forget-note b { color: var(--ink); }
  .forget-note .bad { color: var(--bad); }
  button.id:disabled { cursor: default; }

  button.id.busy {
    color: var(--on-amber);
    background: var(--amber);
    border-color: var(--amber);
    animation: beacon 1s ease-in-out infinite;
  }
  @keyframes beacon {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 50%, transparent); }
    50%      { box-shadow: 0 0 22px 3px color-mix(in srgb, var(--amber) 38%, transparent); }
  }

  /* ---------- switch -> bulb bindings ---------- */
  .links {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px dashed var(--line-hi);
  }
  .links .hdr {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .link-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    font-size: 13px;
  }
  .link-row .arrow { color: var(--link); }
  /* A row that opens something. It is the one place on a sheet where a name is
     a destination rather than a label, so it has to say so before it is
     clicked. */
  .link-row.go {
    cursor: pointer;
    margin: 0 -8px;
    padding: 5px 8px;
    border-radius: 8px;
    transition: background .12s, color .12s;
  }
  .link-row.go .nm { color: var(--link); }
  /* Under the header, before the list: the one sentence that stops the cluster
     names being read as a promise. */
  .sheet .links .hint {
    font-size: 11px;
    color: var(--ink-faint);
    margin: -6px 0 8px;
    text-align: left;
  }
  .link-row .nmwrap {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .link-row .nm { white-space: nowrap; }
  /* Quieter than the name and louder than the capability list: it is how you
     tell two lamps apart, not what you came to read. */
  .link-row .rm {
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .link-row .rm:empty { display: none; }
  .link-row.go .cl { margin-left: auto; text-align: right; padding-left: 14px; }
  .link-row.go:hover { background: color-mix(in srgb, var(--link) 10%, transparent); }
  .link-row.go:focus-visible {
    outline: 1px solid var(--link);
    outline-offset: 1px;
  }
  .link-row .cl {
    margin-left: auto;
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  .empty {
    color: var(--ink-dim);
    font-size: 12px;
    padding: 4px 0;
  }

  button.share {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--link);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--link) 30%, transparent);
    padding: 10px 18px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  button.share:hover:not(:disabled) {
    background: color-mix(in srgb, var(--link) 10%, transparent);
    border-color: var(--link);
  }
  button.share:disabled { opacity: .5; cursor: default; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { flex: 1; min-width: 118px; }

  /* ---------- share sheet ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    animation: fade .2s ease;
  }
  #overlay.on { display: flex; }
  @keyframes fade { from { opacity: 0; } }

  /* The wrapper carries the width. The X hangs off it rather than off the sheet
     so it stays in the corner while the sheet scrolls underneath. */
  .sheetwrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    display: flex;
  }
  /* The chart wants room. On anything narrower than about 1300px it is simply
     the screen, less a margin. */
  .sheetwrap.wide { max-width: min(1280px, 95vw); }

  .sheet {
    --pad: 28px;
    background: var(--panel-hi);
    border: 1px solid var(--line-hi);
    border-radius: 22px;
    width: 100%;
    padding: var(--pad);
    text-align: center;
    /* Without this a long sheet grows past both edges of the screen and takes
       its own controls with it. */
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  /* One close button for every sheet, in the corner. It replaced a "close" or
     "cancel" at the bottom of each one - which on a tall sheet meant scrolling
     to the end to get out of it. */
  .sheet-x {
    position: absolute;
    top: 12px;
    right: 12px;
    border-radius: 50%;
    z-index: 2;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .sheet-x:hover { color: var(--ink); border-color: var(--line-hi); }
  .sheet-x:focus-visible { outline: 1px solid var(--link); outline-offset: 1px; }



  /* ---------- lock ---------- */
  button.lock {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    background: transparent;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--ink-faint);
    border: 1px solid var(--line-hi);
    transition: color .15s, border-color .15s, background .15s;
  }
  button.lock:hover:not(:disabled) { color: var(--ink); }
  /* Locked is a state you want to see from across the room, not a discreet one
     - which is why it is filled, not merely outlined. */
  button.lock.on {
    color: var(--on-amber);
    background: var(--bad);
    border-color: var(--bad);
  }
  button.lock:disabled { opacity: .45; cursor: default; }

  /* Locked: dimmed, but not so dim that the red stops reading. The dimming
     says "this one is out of play", the red icon says why. */
  .tile.locked { opacity: .74; }
  .tile.locked .quick {
    background: var(--bad);
    border-color: var(--bad);
    color: var(--on-amber);
  }
  .tile.locked .quick:hover:not(:disabled) { color: var(--on-amber); }

  .role-tag {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    padding: 2px 7px;
    margin-left: 8px;
    vertical-align: 2px;
  }


  /* ---------- logs ----------
   * Called logs, not console: a console is something you type into, and this
   * only ever shows what already happened.
   *
   * The switch has NO serial console in the production build (CONFIG_SERIAL is
   * off so that two image slots fit for OTA), so this is the only place you can
   * see what is happening: what the Pi sent and what the device answered.
   * Collapsed by default - you do not want a wall of log over the panel. */
  #logs {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: var(--panel);
    border-top: 1px solid var(--line-hi);
    font-size: 11px;
  }
  #logs .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
    color: var(--ink-faint);
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: 10px;
    user-select: none;
  }
  #logs .bar:hover { color: var(--ink); }
  #logs .chev {
    transition: transform .2s;
    display: inline-block;
    font-size: 9px;
  }
  #logs.open .chev { transform: rotate(180deg); }
  #logs .badge {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }
  /* The dot pulses while a command is in flight, so you know nothing is stuck
     - the switch is sleepy and may take 15 seconds to answer. */
  #logs .live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
  }
  #logs.busy .live {
    background: var(--amber);
    animation: livepulse 1s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%, 100% { opacity: .3; }
    50%      { opacity: 1; }
  }
  #logs .body {
    display: none;
    max-height: 480px;
    overflow-y: auto;
    padding: 4px 18px 14px;
    border-top: 1px solid var(--line);
    background: var(--sunken);
  }
  #logs.open .body { display: block; }
  #logs .line {
    display: flex;
    gap: 10px;
    padding: 2px 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-variant-ligatures: none;
  }
  #logs .line .ts { color: var(--ink-faint); flex: none; }
  #logs .line.cmd  { color: var(--ink); }
  #logs .line.ok   { color: var(--link); }
  #logs .line.err  { color: var(--bad); }
  #logs .line.warn { color: var(--amber); }
  #logs .line.step { color: var(--amber); }
  #logs .line.info { color: var(--ink-dim); }
  #logs .empty-log { color: var(--ink-faint); padding: 8px 0; }

  /* Room for the bottom bar, so the last card does not sit underneath it. */
  .wrap { padding-bottom: 120px; }

  /* On short screens, 480px of log would cover the whole page. */
  @media (max-height: 760px) {
    #logs .body { max-height: 55vh; }
  }

  /* ---------- a bulb's own controls ----------
   * Two tall panels you drag, the way a phone does it, rather than a row of
   * labelled sliders. Not fashion: brightness is the thing you came here for,
   * and a control the size of your thumb that shows its value as a filled area
   * is faster to read and to hit than a 6px track with a number beside it.
   *
   * The fill is painted in the bulb's own light colour, so the two controls
   * explain each other - drag the colour and you can see what the brightness is
   * going to look like. */
  .hk {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 20px 0 16px;
  }
  .hk.busy { opacity: .55; pointer-events: none; }
  .hk-pad { display: flex; flex-direction: column; gap: 8px; }
  .hk-cap {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  .hk-lvl, .hk-ct {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    border: 1px solid var(--line-hi);
    touch-action: none;          /* the gesture is ours, not the page's */
    user-select: none;
    -webkit-user-select: none;
    cursor: ns-resize;
  }
  .hk-lvl { width: 132px; height: 292px; background: var(--sunken); }
  .hk-ct { width: 62px; height: 292px; }
  .hk-lvl.grabbed, .hk-ct.grabbed { border-color: var(--ink-faint); }

  /* The same fill and hairline as a lit tile and as the schedule's curve. A
     bulb at 60% is one fact; it should not be three pictures. This panel was
     painted in the light's own colour for a while, which put the colour
     temperature in two places at once - here and in the strip beside it - and
     at 5000 K the fill came out white on white. */
  .hk-fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--lit);
    border-top: 1px solid color-mix(in srgb, var(--amber) 55%, transparent);
    /* Quick enough to feel attached to the finger, slow enough that a jump
       coming from the bulb reads as the bulb moving, not as a glitch. */
    transition: height .18s ease;
  }
  .hk-fill.full { border-top-color: transparent; }
  .hk-lvl.grabbed .hk-fill { transition: background .25s ease; }
  .hk-lvl.off .hk-fill { opacity: .18; }

  /* The face sits above the fill and does not move with it: the number stays
     where your eye already is instead of sliding up and down the panel. */
  .hk-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    pointer-events: none;
  }
  .hk-ico { width: 30px; height: 30px; color: var(--ink); opacity: .75; }
  .hk-ico svg { width: 100%; height: 100%; display: block; }
  .hk-pct {
    font-size: 15px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .hk-lvl.off .hk-ico, .hk-lvl.off .hk-pct { opacity: .4; }
  /* Off does not merely lose its colour - it sinks into the sheet. Grey on its
     own was still a solid object sitting there being grey; what should be left
     is the outline of a control and nothing that looks live.
     Everything tints toward --panel-hi, the sheet's own background, so this
     holds in both themes instead of being a light-mode guess. The brightness
     panel keeps its number readable: with the lamp dark that number is OnLevel,
     which is the one thing worth knowing about a light that is off. */
  /* Two knobs, named, because this is the kind of thing that gets tuned by eye
     several times: how much colour is drained, and how far the whole thing is
     pulled toward the sheet. Fully grey and fully blended read as broken rather
     than as off - the lamp should look asleep, not absent. */
  .hk { --off-grey: .55; --off-blend: 22%; }
  .hk-lvl.off, .hk-ct.off {
    filter: grayscale(var(--off-grey));
    border-color: color-mix(in srgb, var(--line-hi) 65%, var(--panel-hi));
  }
  .hk-lvl.off {
    background: color-mix(in srgb, var(--panel-hi) var(--off-blend), var(--sunken));
  }
  .hk-lvl.off .hk-fill { opacity: .3; }
  .hk-ct.off { opacity: .55; }
  .hk-lvl, .hk-ct { transition: filter .3s ease, opacity .3s ease; }
  .hk.off .hk-cap { opacity: .55; }
  @media (prefers-reduced-motion: reduce) {
    .hk-lvl, .hk-ct { transition: none; }
  }

  /* The colour handle is a bar across the strip and not a dot, so it reads
     against a gradient that is pale at one end and saturated at the other. */
  .hk-knob {
    --p: 0;
    position: absolute;
    left: 6px;
    right: 6px;
    height: 6px;
    /* Inset at both ends, and by more than the handle's own height: the strip
       has a 20px radius, so near the ends it is narrowing, and a handle that is
       merely "inside" still sits in the curve and reads as jammed against the
       edge. Twelve clears it. */
    bottom: calc(12px + var(--p) * (100% - 30px));
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.4);
    pointer-events: none;
    transition: bottom .18s ease;
  }
  .hk-ct.grabbed .hk-knob { transition: none; }

  /* ---------- the light schedule ----------
   * A page of its own. Two curves, both live at once: the filled area is
   * brightness and the line over it is colour temperature, and the fill is
   * painted with the colour the schedule is asking for at that hour - so the
   * light's own colour runs through the shape that says how much of it there
   * is. One picture answers "how bright, and what kind of white" at every hour,
   * which is the question a light schedule exists to answer. */
  .sched-view .section-label { margin-top: 26px; }
  .sched-view .section-label .back {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line-hi);
    border-radius: 8px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .sched-view .section-label .back:hover { color: var(--link); border-color: var(--link); }
  .sched-view .section-label .tzn { font-size: 9px; color: var(--ink-faint); }

  .sched-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 6px 0 12px;
    min-height: 42px;
  }
  .scope-say { font-size: 12px; color: var(--ink-dim); }
  /* Reset sits at the far end from the saves, because it is the one control
     here that throws work away rather than keeping it. Plain outline: it is not
     the thing you came to press. */
  .sched-reset {
    margin-left: auto;
    flex: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line-hi);
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .sched-reset:hover { color: var(--amber); border-color: var(--amber); }
  .sched-reset:active { transform: translateY(1px); }

  /* The save button lives in the top bar, where the column stepper used to be:
     it is the only thing on this page you press to make something happen, so it
     belongs beside the sentence that says what will happen.
     Same treatment as an active control anywhere else here - teal outline over a
     wash of the same colour. A solid block was louder than anything else on the
     page and read as borrowed from somewhere else. */
  .sched-save {
    flex: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--link);
    background: color-mix(in srgb, var(--link) 13%, transparent);
    border: 1px solid var(--link);
    border-radius: 10px;
    padding: 11px 24px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .sched-save:hover:not(:disabled) {
    background: color-mix(in srgb, var(--link) 22%, transparent);
  }
  .sched-save:active:not(:disabled) { transform: translateY(1px); }
  .sched-save:disabled { opacity: .5; cursor: default; }
  /* With a target picked, saving globally is no longer the obvious next thing,
     so it steps back rather than disappearing - it is still what you want if
     you change your mind. */
  .sched-save.dim { background: transparent; color: var(--ink-dim); border-color: var(--line-hi); }
  .sched-save.dim:hover { color: var(--link); border-color: var(--link); }

  /* The second save, and the target it will use. A split button because those
     are two different questions with one answer between them: press the label
     to save for what it names, press the caret to change what it names. */
  .split { display: flex; flex: none; }
  .split button {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line-hi);
    padding: 11px 16px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .split .lbl { border-radius: 10px 0 0 10px; border-right: none; }
  .split .caret { border-radius: 0 10px 10px 0; padding: 11px 12px; }
  .split button:hover { color: var(--link); border-color: var(--link); }
  .split.armed button {
    color: var(--link);
    border-color: var(--link);
    background: color-mix(in srgb, var(--link) 13%, transparent);
  }
  .split.armed .lbl { border-right: none; }

  .pick .nid.own { color: var(--amber); }

  .chart {
    border: 1px solid var(--line-hi);
    border-radius: 14px;
    background: var(--sunken);
    padding: 2px 0 0;
    touch-action: none;          /* the gesture is ours, not the page's */
    overflow: hidden;
  }
  /* Only over a line is anything grabbable, and the cursor should not suggest
     otherwise across the rest of the plot. */
  .chart.on-line { cursor: ns-resize; }
  .chart svg { display: block; width: 100%; height: auto; max-height: 62vh; }

  /* Faint, and only where a horizontal line means something. There used to be a
     separator per column plus a ladder plus a stem - three kinds of line
     competing with the two that carry the data. */
  .chart .grid {
    stroke: var(--line-hi);
    stroke-width: 1;
    stroke-dasharray: 2 7;
  }
  .chart .axis {
    fill: var(--ink-faint);
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 0;
  }
  .chart .tick { stroke: var(--line-hi); stroke-width: 1; }

  /* The same fill a lit tile uses, and the same hairline on top of it. */
  .chart .fill { stroke: none; fill: var(--lit); }
  /* The top of the fill: it is the brightness curve, and it has to stay
     findable where the fill has faded out beneath it. */
  .chart .edge {
    fill: none;
    stroke: color-mix(in srgb, var(--amber) 55%, transparent);
    stroke-width: 2;
    stroke-linejoin: round;
  }
  /* Colour temperature. Ink rather than a colour of its own - the fill under it
     is already saying what colour the light is, and a second coloured line
     would be the same fact drawn twice. */
  .chart .ctline {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.5;
    stroke-linejoin: round;
    opacity: .62;
  }

  .chart .nowline {
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: .45;
    stroke-dasharray: 4 4;
  }
  .chart .nowtext {
    fill: var(--ink-dim);
    font-size: 15px;
    font-family: var(--mono);
    letter-spacing: .5px;
  }
  /* The curve's two values for this minute, under the time they belong to.
     Quieter than the time: the time is what you look for, these are what you
     came to find out once you have found it. */
  .chart .nowval {
    fill: var(--ink-faint);
    font-size: 12.5px;
    font-family: var(--mono);
    letter-spacing: .3px;
  }

  /* The dormant handles: one open ring per column on each curve, marking the
     twelve places the chart can be taken hold of. Without them the grab points
     were invisible until the pointer happened to find one, so the chart looked
     like a picture rather than a control.

     No fill, so the plot shows through - that alone separates them from the one
     you are holding, which has a solid centre. And the curve is masked OUT
     inside each ring rather than drawn through it, so a dot reads as a gap in
     the line rather than a bead sitting on top of it. Ground and fill show
     through; the line does not. */
  /* Each ring takes the stroke of the line it sits on, declaration for
     declaration - same width, same colour, same fade. Drawn at full strength
     against a line at 55% they read as a different object stuck onto the
     chart; identical, they read as part of it. */
  .chart .dot { fill: none; pointer-events: none; }
  /* The brightness ring is filled with the fill's own colour rather than left
     open. It rides the top edge of the filled area, so an open ring there is
     half ground and half fill - the one place on the chart where see-through
     reads as a smudge instead of a marker. Filled, the area simply continues
     through it. The colour ring stays open: it crosses in and out of the fill
     all day, so no single colour would sit right under it. */
  .chart .dot.level {
    stroke: color-mix(in srgb, var(--amber) 55%, transparent);
    stroke-width: 2;
    fill: var(--lit-solid);
  }
  /* Opacity rather than color-mix, to match .ctline exactly. Safe here only
     because the ring has no fill to fade with it. */
  .chart .dot.ct { stroke: var(--ink); stroke-width: 2.5; opacity: .62; }

  /* The handle. A circle on the curve with an arrow above and below - the whole
     vocabulary, no legend needed - and it exists only under the pointer, so the
     chart at rest is the two curves and nothing else. */
  .chart .handle .ring {
    fill: var(--panel);
    stroke: var(--ink);
    stroke-width: 2;
  }
  .chart .handle .arw {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .45;
  }
  .chart .handle.live .arw { opacity: .8; }
  .chart .handle .hval {
    fill: var(--ink);
    font-size: 12px;
    font-family: var(--mono);
    paint-order: stroke;
    stroke: var(--sunken);
    stroke-width: 3.5;
    stroke-linejoin: round;
  }

  .sched-foot {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    min-height: 30px;
  }
  .sched-foot .note { text-align: left; margin: 0; flex: 1; }
  /* It was wearing `.chip.wideadd`, whose rules are all scoped to `.sheet` -
     so on a page rather than in a dialog it came out as a browser default
     button. Same outline as everything else here, in amber because it undoes an
     override rather than making one. */
  .sched-revert {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--amber);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 10px;
    padding: 10px 18px;
    flex: none;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .sched-revert:hover:not(:disabled) {
    border-color: var(--amber);
    background: color-mix(in srgb, var(--amber) 12%, transparent);
  }
  .sched-revert:disabled { opacity: .5; cursor: default; }

  /* ---------- which bulbs you are editing ----------
   * A list rather than a row of chips: chips are fine for three bulbs and wrap
   * into a wall at thirty, with nowhere to put a room name or the schedule each
   * one follows. */
  .scope {
    text-align: left;
    border: 1px solid var(--line-hi);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .scope-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    font-size: 9px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--sunken-hi);
    border-bottom: 1px solid var(--line);
  }
  .scope-head .rule { flex: 1; height: 1px; background: var(--line-hi); }
  .scope-head .all {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--line-hi);
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .scope-head .all:hover { color: var(--link); border-color: var(--link); }

  /* Scrolls, because a house can have thirty bulbs and the chart above it is
     the thing that must not be pushed off the screen. */
  .scope-list { max-height: 168px; overflow-y: auto; }
  .srow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 12px;
    color: var(--ink);
    margin: 0;
  }
  .srow:last-child { border-bottom: none; }
  .srow:hover { background: color-mix(in srgb, var(--link) 7%, transparent); }
  .srow.on { background: color-mix(in srgb, var(--link) 12%, transparent); }
  /* Specific enough to beat `.sheet input`, which is written for text fields
     and would stretch this checkbox to the full width of the row. */
  .srow input {
    width: 15px;
    height: 15px;
    min-width: 0;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    accent-color: var(--link);
    flex: none;
  }
  .srow .nm { flex: 1; }
  .srow .rm {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  /* Which schedule this bulb answers to - the column that makes "are any of
     mine different?" a question you answer by looking. */
  .srow .fw {
    width: 74px;
    text-align: right;
    flex: none;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .srow .fw.own { color: var(--amber); }

  /* On a phone the sheet is about 270px of usable width, and everything in the
     plot is in svg user units - so it shrinks with the element and the hour
     labels come out around 5px unless they are put back. */
  @media (max-width: 560px) {
    .sheet { --pad: 16px; padding: 20px var(--pad); }
    .sched-top { flex-wrap: wrap; gap: 10px; }
    .sched-save { margin-left: 0; flex: 1; }
    .split { flex: 1; }
    .split .lbl { flex: 1; }
    .sched-foot { flex-direction: column; align-items: stretch; }
    .sched-revert { width: 100%; }
    /* Twenty-five labels do not fit across a phone; every third, and the grid
       still carries the rest. */
    .chart .axis { font-size: 24px; }
    .chart .axis:not(.keep) { display: none; }
    .chart .nowtext { font-size: 28px; }
    .chart .handle .hval { font-size: 24px; }
    .hk-lvl { width: 118px; height: 240px; }
    .hk-ct { width: 54px; height: 240px; }
  }

  /* Two halves of one question, so they get equal halves of the width. Sized
     to their own text they read as two unrelated buttons, and the longer label
     looks like the important one. */
  .series {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 4px;
  }
  .series button { flex: 1 1 0; }
  /* Both halves are the same button. They differ in one thing only - which of
     them is true - so anything else that differs between them is noise, and
     size is the loudest kind. The LOCKED half used to borrow `danger`, the
     class belonging to the delete-room button; same specificity, defined
     later, so it won and brought `padding: 11px` and `margin-top: 8px` with
     it. One half of a segmented control sat lower and shorter than the other,
     and was red whether or not it was in force. */
  .series button {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--line);
    padding: 7px 13px;
    margin: 0;
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .series button:not(.on):hover:not(:disabled) { color: var(--ink-dim); border-color: var(--line-hi); }
  /* Colour is what says "this is the one". The half that is not in force is
     monochrome, so there is nothing to compare it against. */
  .series button.on {
    color: var(--link);
    background: color-mix(in srgb, var(--link) 16%, transparent);
    border-color: var(--link);
  }
  .series button:disabled { opacity: .45; cursor: default; }
  /* Waiting on the device, not on us.
   *
   * A spinner rather than a pulse, and inside the button that was pressed, so
   * the wait is attached to the thing that caused it. It matters more here than
   * anywhere else on the page: the switch is a sleepy end device that listens
   * once every 15 seconds, so this can genuinely sit for ten before the write
   * lands. Without something turning, ten seconds of a still screen is a broken
   * panel. The seconds count up beside it, because an indeterminate spinner
   * says "working" and a number says "keep waiting". */
  .series button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .series button.waiting::before {
    content: "";
    width: 11px;
    height: 11px;
    flex: none;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .series button .secs { opacity: .7; font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .series button.waiting::before { animation: none; opacity: .6; }
  }
  .rolehdr { margin-top: 4px; }
  /* The primary control of a sheet, not a tab strip: full width, and big enough
     to hit without aiming. */
  .series.big { gap: 8px; margin: 18px 0 14px; }
  .series.big button { flex: 1; padding: 12px 10px; font-size: 11px; }
  /* Louder than the specificity of anything that might collide with it again.
     A segmented control whose halves are different sizes is a bug you see
     before you read a word of it. */
  .sheet .series.big button { padding: 12px 10px; margin: 0; width: auto; }
  /* Locked is a state you want to see from across the room, so it is red and
     filled - the same reasoning as the old lock button it replaces. Off, it is
     as grey as its neighbour: a red outline on the half you have NOT chosen
     says the lock is on when it is not. */
  .series button.on.locked {
    color: var(--on-amber);
    background: var(--bad);
    border-color: var(--bad);
  }
  /* A lit bulb is amber everywhere else on the page; the sheet must not call the
     same thing teal. */
  .series button.on.warm {
    color: var(--amber);
    background: color-mix(in srgb, var(--amber) 15%, transparent);
    border-color: var(--amber);
  }

  /* The bindings list reads as a list, so it stays left aligned inside a sheet
     that is otherwise centered. */
  .sheet .links { text-align: left; margin-top: 18px; }
  /* Every list in a sheet reads as a list: rows in a bordered box, separated,
     and capped so a long one scrolls rather than pushing the buttons off the
     bottom. The header and its hint stay above the box, so they do not scroll
     away with the rows. The cap is ~4.5 rows - enough that the next one is
     visibly cut off, which is what says "there is more" without a scrollbar
     having to appear. */
  .sheet .links .rows {
    border: 1px solid var(--line-hi);
    border-radius: 12px;
    max-height: 208px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .sheet .links .rows .link-row {
    margin: 0;
    border-radius: 0;
    padding: 10px 13px;
  }
  .sheet .links .rows .link-row + .link-row { border-top: 1px solid var(--line); }
  .sheet .links .rows .link-row.go:hover {
    background: color-mix(in srgb, var(--link) 9%, transparent);
  }

  /* A device the panel reads rather than commands: its sheet is a list of
     numbers, so they get a column each and line up down the page. */
  .reads { text-align: left; margin: 18px 0 4px; }
  .read {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .read:last-child { border-bottom: none; }
  .read .k {
    flex: 1;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .read .v {
    font-size: 15px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .sheet .actions { margin-top: 16px; }
  /* In a sheet the small edit buttons sit in a row with identify and share, so
     they have to be the same height. */
  .sheet .actions button.edit { padding: 10px 18px; font-size: 11px; }

  /* Everything inside picks up a radius as well. Square controls in a rounded
     frame read as an oversight rather than as a contrast. */
  .sheet button.go,
  .sheet .actions button,
  .sheet button.danger,
  .sheet .chip.wideadd,
  .sheet input,
  .series button { border-radius: 10px; }
  .sheet .pick { border-radius: 12px; overflow: hidden; }

  .sheet h2 {
    margin: 0 0 4px;
    font-size: 13px;
    letter-spacing: .24em;
    text-transform: uppercase;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 26px;
  }
  /* Out of the way until wanted, and never moving the title when it appears -
     the space is reserved whether it is visible or not. */
  .sheet h2 .pen {
    width: 15px;
    height: 15px;
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, color .15s;
  }
  .sheet h2 .pen svg { width: 100%; height: 100%; display: block; }
  .sheet h2:hover .pen, .sheet h2 .pen:focus-visible { opacity: 1; }
  .sheet h2 .pen:hover { color: var(--link); }
  .sheet h2 .nmedit {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    text-align: center;
    color: var(--ink);
    background: var(--sunken);
    border: 1px solid var(--link);
    border-radius: 8px;
    padding: 3px 10px;
    width: 100%;
    max-width: 260px;
  }
  .sheet h2 .nmedit:focus { outline: none; }
  .sheet .who {
    color: var(--ink-dim);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  /* The identity line doubles as the one place the panel explains itself. It
     crossfades to the message and back, so nothing moves and nothing is added -
     the line you were already reading simply says something else for a moment.
     Amber while it does, because that is what the schedule is everywhere here. */
  .sheet .who { transition: opacity .26s ease; }
  .sheet .who.gone { opacity: 0; }
  .sheet .who.said { color: var(--amber); }
  @media (prefers-reduced-motion: reduce) {
    .sheet .who { transition: none; }
  }
  /* QR on white - scans far more reliably than inverted */
  .qr {
    background: #fff;
    padding: 14px;
    display: inline-block;
    line-height: 0;
  }
  .qr svg { width: 232px; height: 232px; }

  .manual {
    margin-top: 20px;
    font-size: 21px;
    letter-spacing: .12em;
    color: var(--amber);
  }
  .manual small {
    display: block;
    font-size: 9px;
    letter-spacing: .22em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: .22em;
  }
  .countdown {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .countdown.low { color: var(--bad); }
  .sheet .note {
    margin-top: 18px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink-faint);
    text-align: left;
  }
  .sheet .working { color: var(--ink-dim); font-size: 12px; padding: 40px 0; }
  .sheet .failed { color: var(--bad); font-size: 12px; padding: 20px 0; text-align: left; }


  .sheet label {
    display: block;
    text-align: left;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 14px 0 6px;
  }
  .sheet input {
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    background: var(--sunken);
    border: 1px solid var(--line-hi);
    color: var(--ink);
    padding: 11px 12px;
  }
  .sheet input:focus { outline: none; border-color: var(--link); }
  /* room combobox: input + filtered list */
  .combo { position: relative; }
  .combo-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--sunken);
    border: 1px solid var(--line-hi);
    border-top: none;
    max-height: 190px;
    overflow-y: auto;
    z-index: 5;
    display: none;
    text-align: left;
  }
  .combo-list.on { display: block; }
  .combo-list div {
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .combo-list div:last-child { border-bottom: none; }
  .combo-list div:hover,
  .combo-list div.sel { background: color-mix(in srgb, var(--link) 12%, transparent); color: var(--link); }
  .combo-list div.new { color: var(--link); }
  .combo-list div.new b { font-weight: 400; color: var(--ink); }
  .combo-list .none { color: var(--ink-faint); cursor: default; }
  .combo-list .none:hover { background: none; color: var(--ink-faint); }

  .sheet button.go {
    margin-top: 22px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--on-link);
    background: var(--link);
    border: 1px solid var(--link);
    padding: 12px 22px;
    cursor: pointer;
    width: 100%;
  }
  .sheet button.go:disabled { opacity: .5; cursor: default; }

  /* ---------- toolbar actions ---------- */
  .rooms {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }
  .rooms .chip {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: transparent;
    border: 1px dashed var(--line-hi);
    padding: 9px 15px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .rooms .chip:hover { color: var(--link); border-color: var(--link); }
  .rooms .chip.bulk:hover { color: var(--bad); border-color: var(--bad); }
  /* Not an "add": it opens something that already exists. */
  .rooms .chip.plain { border-style: solid; color: var(--ink-dim); }

  /* ---------- a room ----------
   * The section IS the room: its header names it, its grid holds it, and its
   * whole area is the drop target. Making only the grid a target would mean
   * missing an empty room by a few pixels of header. */
  .room { margin-bottom: 6px; }
  .room .section-label, .toolbar { user-select: none; -webkit-user-select: none; }
  .room .section-label .count {
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }
  .room .chip-edit {
    display: grid;
    place-items: center;
    width: 24px;
    height: 22px;
    padding: 0;
    background: transparent;
    border: 1px solid var(--line-hi);
    color: var(--ink-faint);
    cursor: pointer;
  }
  .room .chip-edit svg { width: 13px; height: 13px; display: block; }
  .room .chip-edit:hover { color: var(--link); border-color: var(--link); }

  .empty-room {
    grid-column: 1 / -1;
    border: 1px dashed var(--line-hi);
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- dragging a device ---------- */
  .tile.dragging {
    z-index: 50;
    pointer-events: none;      /* so elementFromPoint sees what is underneath */
    cursor: grabbing;
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
    transition: none;          /* it must track the finger, not lag behind it */
  }
  /* The gap the tile would drop into. It is a real grid item, so the preview is
     the layout itself rather than a line drawn over a layout that might
     disagree with it. */
  .grid .tile.ghost {
    aspect-ratio: auto;        /* its height is the tile's, measured at grab */
    background: none;
    border-style: dashed;
    border-color: var(--link);
    pointer-events: none;
    animation: none;
  }
  /* While a drag is live, nothing else on the page should light up under the
     pointer as it passes over. */
  body.dnd { cursor: grabbing; user-select: none; }
  body.dnd .tile:hover { transform: none; }
  .room.over .grid {
    outline: 1px dashed var(--link);
    outline-offset: 6px;
    border-radius: 12px;
  }
  .room.over .empty-room { display: none; }

  /* Destructive, and it says so. It is also the only button on the page that
     asks twice before it does anything. */
  .sheet button.danger {
    font-family: inherit;
    width: 100%;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--bad);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    padding: 11px;
    margin-top: 8px;
    cursor: pointer;
  }
  .sheet button.danger:hover { border-color: var(--bad); }
  .sheet button.danger.armed { background: var(--bad); color: var(--on-amber); }

  .pick .group {
    padding: 9px 14px;
    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--sunken-hi);
    border-bottom: 1px solid var(--line);
  }

  button.edit {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--line-hi);
    padding: 6px 12px;
    cursor: pointer;
  }
  /* Only the first button pushes the group to the right; otherwise the two
     would drift apart, each with an auto of its own. */
  .links .hdr button.edit:first-of-type { margin-left: auto; }
  button.edit:hover { color: var(--link); border-color: var(--link); }
  .links .hdr { display: flex; align-items: center; gap: 12px; }

  .pick {
    text-align: left;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid var(--line-hi);
    margin-top: 14px;
  }
  .pick label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    margin: 0;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }
  .pick label:last-child { border-bottom: none; }
  .pick label:hover { background: color-mix(in srgb, var(--link) 7%, transparent); }
  .pick input { width: 16px; height: 16px; accent-color: var(--link); }
  .pick .room {
    margin-left: auto;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .pick .nid { color: var(--ink-faint); font-size: 11px; }


  details.raw { margin-top: 14px; }
  details.raw summary {
    cursor: pointer;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  details.raw pre {
    background: var(--sunken);
    border: 1px solid var(--line);
    padding: 12px;
    overflow-x: auto;
    font-size: 11px;
    color: var(--ink-dim);
    max-height: 320px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1><button type="button" class="home" id="go-home"
                  title="rooms" aria-label="go to rooms">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <clipPath id="logo-house">
              <path d="M12 2.2 21.8 10.4 V19 a2 2 0 0 1-2 2 H4.2 a2 2 0 0 1-2-2 V10.4 Z"/>
            </clipPath>
          </defs>
          <!-- The light inside, drawn as the level fill a lit tile carries -
               the same shape this whole interface is built out of. -->
          <g clip-path="url(#logo-house)">
            <rect class="lglit"  x="0" y="13.4" width="24" height="12"/>
            <rect class="lgedge" x="0" y="13" width="24" height="1"/>
          </g>
          <path class="lgline"
                d="M12 2.2 21.8 10.4 V19 a2 2 0 0 1-2 2 H4.2 a2 2 0 0 1-2-2 V10.4 Z"/>
        </svg>
        <span>Smarthome<span class="dot">.</span></span>
      </button></h1>
      <span id="status">connecting</span>
    </div>
    <!-- The two things you do TO the house, as opposed to the things you do
         to one lamp. They were down in the toolbar as three separate "+"
         chips plus a schedule chip, which put four permanent buttons across
         the top of a page whose subject is the rooms underneath them. -->
    <div class="hdr-acts">
      <button type="button" class="hact" id="go-sched">schedule</button>
      <button type="button" class="hact add" id="go-add"
              title="add a device, a switch or a room" aria-label="add">+</button>
    </div>
    <div id="theme">
      <button type="button" class="tsw" data-state="auto">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <mask id="theme-cut">
            <rect x="-6" y="-6" width="36" height="36" fill="#fff"/>
            <!-- the base positions are the "day" state: both outside the disc -->
            <circle class="carve" cx="26" cy="-2" r="7" fill="#000"/>
            <rect class="split" x="12" y="-6" width="20" height="36" fill="#000"/>
          </mask>
          <g class="rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="12"  y1="3.8"  x2="12"   y2="1.4"/>
            <line x1="17.8" y1="6.2" x2="19.5" y2="4.5"/>
            <line x1="20.2" y1="12"  x2="22.6" y2="12"/>
            <line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/>
            <line x1="12"  y1="20.2" x2="12"   y2="22.6"/>
            <line x1="6.2" y1="17.8" x2="4.5"  y2="19.5"/>
            <line x1="3.8" y1="12"   x2="1.4"  y2="12"/>
            <line x1="6.2" y1="6.2"  x2="4.5"  y2="4.5"/>
          </g>
          <circle class="ring" cx="12" cy="12" r="6" fill="none"
                  stroke="currentColor" stroke-width="1.6"/>
          <circle class="body" cx="12" cy="12" r="6" fill="currentColor"
                  mask="url(#theme-cut)"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="content"></div>

</div>


<div id="logs">
  <div class="bar">
    <span class="live"></span>
    <span class="chev">&#9650;</span>
    <span>logs</span>
    <span class="badge"></span>
  </div>
  <div class="body"><div class="empty-log">nothing yet</div></div>
</div>

<div id="overlay">
  <!-- The wrapper carries the width so the X can sit at its corner and stay
       there while the sheet scrolls inside. -->
  <div class="sheetwrap" id="sheetwrap">
    <button type="button" class="sheet-x" id="sheet-x" title="close"
            aria-label="close">&times;</button>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);

const state = { devices: null, switches: [], bySwitch: {}, raw: null,
                locks: {}, bulbs: {}, view: 'home' };

function setStatus(text, cls) {
  const el = $('#status');
  el.textContent = text;
  el.className = cls || '';
}

// The old single-'switch' shape is still accepted, so existing installs keep
// working. One place knows that, and everything that receives a fresh
// devices.json goes through it.
function adoptDevices(d) {
  state.devices = d;
  state.switches = d.switches || (d.switch ? [d.switch] : []);
}

async function load() {
  try {
    adoptDevices(await (await api('/api/devices')).json());
  } catch (e) {
    setStatus('panel offline', 'err');
    return;
  }

  render();  // the devices show up right away

  // What the bulbs are doing, in the background. It is the one value here that
  // changes without us: the wall switch sends Toggle straight to the bulb over
  // Thread and the Pi never sees it. See pollBulbs().
  loadBulbs();

  // The lock state is read separately so it does not delay the first render.
  // Without that, the page would sit blank for 30 s when nobody answers.
  api('/api/lock').then(r => r.json()).then(j => {
    state.locks = j.bySwitch || {};
    render();
  }).catch(() => {});

  try {
    const b = await (await api('/api/bindings')).json();
    state.bySwitch = b.bySwitch || {};
    state.raw = b.raw;
    // The state comes from the server, in layers. The old version checked
    // `b.raw.error`, but `raw` is keyed by switch node, so that field never
    // exists - and it always fell through to "connected". Which meant it said
    // "connected" even with no dongle and no Thread network, which only proved
    // that the browser had reached the server.
    const h = b.health || {};
    if (!h.chipTool) {
      setStatus('chip-tool is not answering', 'err');
    } else if (!h.total) {
      setStatus('no devices configured', '');
    } else if (h.reachable === 0) {
      setStatus('no device is answering', 'err');
    } else if (h.reachable < h.total) {
      setStatus(`connected ${h.reachable}/${h.total}`, 'warn');
    } else {
      setStatus('connected', 'ok');
    }
  } catch (e) {
    setStatus('chip-tool unreachable', 'err');
  }
  render();
}

/* A row in a "controls / controlled by" list, and it opens the thing it names.
 *
 * The two lists are the only place the panel states a relationship between two
 * devices, so they are also the only place you are looking at a device you did
 * not come here for. Making the name dead text meant reading it, closing the
 * sheet, finding the tile and opening that - four steps to follow a link the
 * page had already drawn for you. */
/* Every list inside a sheet, built the same way.
 *
 * A header that stays put, an optional line of explanation, and a bordered box
 * of rows that scrolls once there are more than fit. Without the box the rows
 * ran together - two lamps read as one paragraph - and a switch driving eight
 * of them would have pushed the buttons off the bottom of the sheet.
 *
 * Returns the rows container. Callers that end up with nothing to put in it
 * drop it, so an empty list is a sentence rather than an empty frame. */
function sheetList(box, header, hint) {
  box.innerHTML = `<div class="hdr">${header}</div>`
                + (hint ? `<div class="hint">${hint}</div>` : '')
                + '<div class="rows"></div>';
  return box.querySelector('.rows');
}

function sheetListDone(box) {
  const rows = box.querySelector('.rows');
  if (rows && !rows.children.length) { rows.remove(); }
}

/* The title is the name, so the title is where you rename it.
 *
 * Not a fifth button in a row of four: the name is already on screen, and the
 * thing you want to change is the thing you are looking at. A pencil appears on
 * hover, the heading becomes a field, Enter saves and Escape puts it back.
 *
 * The name is ours alone - Matter never sees it - so this is a write to
 * devices.json and nothing else. */
function nameable(sheet, dev, after) {
  const h = sheet.querySelector('h2');
  h.innerHTML = '<span class="nmtext"></span>'
              + '<button type="button" class="pen" title="rename"'
              + ' aria-label="rename">' + ICONS.pencil + '</button>';
  h.querySelector('.nmtext').textContent = dev.name;

  const edit = () => {
    const input = document.createElement('input');
    input.className = 'nmedit';
    input.value = dev.name;
    input.maxLength = 40;
    h.replaceChildren(input);
    input.focus();
    input.select();

    let done = false;
    const stop = keep => {
      if (done) { return; }
      done = true;
      const want = input.value.trim();
      if (!keep || !want || want === dev.name) { nameable(sheet, dev, after); return; }
      save(want);
    };
    input.onkeydown = ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); stop(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); stop(false); }
    };
    input.onblur = () => stop(true);
  };

  const save = async want => {
    let j;
    try {
      j = await (await api('/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node: dev.node, name: want })
      })).json();
    } catch (err) { j = { error: String(err) }; }
    if (j.error) {
      nameable(sheet, dev, after);
      return setStatus('not renamed: ' + j.error, 'err');
    }
    dev.name = j.name;
    nameable(sheet, dev, after);
    setStatus('renamed to ' + j.name, 'ok');
    await load();
    if (after) { after(); }
  };

  h.querySelector('.pen').onclick = edit;
}

function linkRow(name, open, tail, where) {
  const row = document.createElement('div');
  row.className = 'link-row go';
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.title = 'open ' + name + (where ? ' \u2014 ' + where : '');
  // The room, because a name is not an identifier. Two lamps called "Light 1"
  // in different rooms is the normal case, not an edge case, and a list of
  // them tells you nothing about which one this switch is wired to.
  // Name over room, capabilities to the right. Side by side they fought for the
  // same line and the name wrapped mid-word - "Light" over "1".
  row.innerHTML = '<span class="arrow">&rarr;</span>'
                + '<span class="nmwrap"><span class="nm"></span>'
                + '<span class="rm"></span></span>'
                + (tail ? `<span class="cl">${tail}</span>` : '');
  row.querySelector('.nm').textContent = name;
  row.querySelector('.rm').textContent = where || '';
  row.onclick = open;
  row.onkeydown = ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
  };
  return row;
}

function bulbName(node) {
  const b = (state.devices.bulbs || []).find(x => String(x.node) === String(node));
  return b ? b.name : `unknown node ${node}`;
}

function switchName(node) {
  const s = state.switches.find(x => String(x.node) === String(node));
  return s ? s.name : `unknown node ${node}`;
}

// The Matter clusters a switch can be bound on. 768 is 0x300, ColorControl -
// it showed as "cluster 768" in the bindings list for want of one line here.
const CLUSTER_NAMES = { 6: 'on/off', 8: 'brightness', 768: 'colour' };

/* ---------- icons ----------
 * Inline SVG, and no icon font. The Pi may have no way out to the internet, and
 * a font that fails to load would leave every tile blank - the one thing the
 * grid cannot survive, since the icon IS the button. currentColor throughout,
 * so the palette drives them and both themes work with no second copy. */
const ICONS = {
  bulb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
