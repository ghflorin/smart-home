    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 2.8a6.2 6.2 0 0 0-3.8 11.1c.6.5 1 1.2 1.1 1.9l.1.7h5.2l.1-.7c.1-.7.5-1.4 1.1-1.9A6.2 6.2 0 0 0 12 2.8Z"/>
    <path d="M9.6 18.6h4.8"/><path d="M10.6 21.2h2.8"/></svg>`,

  switch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4.6" y="2.9" width="14.8" height="18.2" rx="3"/>
    <rect x="8.7" y="7" width="6.6" height="10" rx="2.4"/>
    <path d="M9.5 12h5"/></svg>`,

  lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4.9" y="10.3" width="14.2" height="10.4" rx="2.6"/>
    <path d="M8.5 10.3V7.5a3.5 3.5 0 0 1 7 0v2.8"/>
    <circle cx="12" cy="15.5" r="1.25"/></svg>`,

  // The same padlock with the shackle swung open. It is the quick action on an
  // unlocked switch, so it has to read as "lock this" - the switch icon that
  // used to sit there described the DEVICE while the button it lives in changes
  // the LOCK, which is the one thing a button must never do.
  unlock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4.9" y="10.3" width="14.2" height="10.4" rx="2.6"/>
    <path d="M8.5 10.3V7.5a3.5 3.5 0 0 1 6.8-1.2"/>
    <circle cx="12" cy="15.5" r="1.25"/></svg>`,

  pencil: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>
    <path d="M14.5 6.5l3 3"/></svg>`,

  // Anything that is neither a switch nor a bulb: a sensor, a plug, a blind.
  // A dial, because what these have in common is that they READ - the panel
  // does not command them, it asks them.
  sensor: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="8.4"/>
    <path d="M12 7.2v4.8l3.1 2"/></svg>`,

  // A wrench, not a gear. A gear at 13px - a disc with spokes around it - is
  // the same drawing as a sun, and this button sits on a page whose other round
  // control is a light.
  wrench: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M15.6 3.3a5.4 5.4 0 0 0-6.9 6.9l-5.2 5.2a1.9 1.9 0 0 0 0 2.7l1.5 1.5a1.9 1.9 0 0 0 2.7 0l5.2-5.2a5.4 5.4 0 0 0 6.9-6.9l-3.2 3.2-2.9-.6-.6-2.9 3.2-3.2Z"/></svg>`,

  // The size picker: how many tiles fit, drawn literally.
  sizeS: `<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
    <rect x="0" y="0" width="3.5" height="3.5"/><rect x="5.25" y="0" width="3.5" height="3.5"/><rect x="10.5" y="0" width="3.5" height="3.5"/>
    <rect x="0" y="5.25" width="3.5" height="3.5"/><rect x="5.25" y="5.25" width="3.5" height="3.5"/><rect x="10.5" y="5.25" width="3.5" height="3.5"/>
    <rect x="0" y="10.5" width="3.5" height="3.5"/><rect x="5.25" y="10.5" width="3.5" height="3.5"/><rect x="10.5" y="10.5" width="3.5" height="3.5"/></svg>`,
  sizeM: `<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
    <rect x="0" y="0" width="6" height="6"/><rect x="8" y="0" width="6" height="6"/>
    <rect x="0" y="8" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/></svg>`,
  sizeL: `<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
    <rect x="0.5" y="0.5" width="13" height="13"/></svg>`,
};

/* ---------- tile size ----------
 * Kept in localStorage, so it is per browser and not per installation: the
 * tablet on the wall and the laptop want different sizes, and they are looking
 * at the same server. */
const SIZES = ['s', 'm', 'l'];
let tileSize = 'm';
try { tileSize = localStorage.getItem('tiles') || 'm'; } catch (e) {}
if (!SIZES.includes(tileSize)) { tileSize = 'm'; }

function setTileSize(v) {
  tileSize = v;
  try { localStorage.setItem('tiles', v); } catch (e) {}
  render();
}

/* One tile. The two halves are wired here rather than by a later
 * querySelectorAll pass, so a tile always carries its own device - with a grid
 * you cannot recover it from a data attribute without stringifying everything.
 *
 * The split: the round icon is the quick action, the rest of the tile opens the
 * settings. click on the icon stops there, otherwise every quick action would
 * also pop the sheet open behind it. */
/* ---------- the screen is patched, never rebuilt ----------
 *
 * render() used to empty #content and build everything again. That is fine
 * when it happens on a click and ruinous when it happens on a timer: the bulb
 * poll runs every 15 s, so every 15 s the whole grid was destroyed, recreated,
 * and faded back in - and if it landed while you were dragging a tile, the
 * element under your finger stopped existing.
 *
 * So render() now reconciles: it keeps the elements it already has, moves the
 * ones that belong elsewhere, creates only what is new, and writes a property
 * only when its value actually differs. Nothing flashes, focus and scroll
 * survive, and a redraw during a drag is simply deferred.
 *
 * What makes it possible to keep an element is that its listeners are bound
 * once, at build time, and read `el._o` - the current options - when they fire.
 * Rebinding on every redraw would be most of the work of rebuilding anyway. */
const DOM = { toolbar: null, sizer: [], lockAll: [], sections: new Map(),
              tiles: new Map(), raw: null, sched: null,
              fresh: 0, firstPaint: true };

function setText(el, text) {
  const t = text == null ? '' : String(text);
  if (el.textContent !== t) { el.textContent = t; }
}

function setAttr(el, name, val) {
  if (val === null || val === undefined || val === '') {
    if (el.hasAttribute(name)) { el.removeAttribute(name); }
  } else if (el.getAttribute(name) !== String(val)) {
    el.setAttribute(name, val);
  }
}

/* Put exactly these children, in this order, under this parent - moving what is
 * already there rather than replacing it. Anything not in the list goes. */
function place(parent, wanted) {
  const want = new Set(wanted);
  for (const child of [...parent.children]) {
    if (!want.has(child)) { child.remove(); }
  }
  wanted.forEach((el, i) => {
    if (parent.children[i] !== el) { parent.insertBefore(el, parent.children[i] || null); }
  });
}

function buildTile(o) {
  const el = document.createElement('div');
  el.className = 'tile fresh';
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.dataset.node = o.node;

  const q = document.createElement('button');
  q.type = 'button';
  q.className = 'quick';

  const meta = document.createElement('div');
  meta.className = 'tmeta';
  const name = document.createElement('div');
  name.className = 'tname';
  const st = document.createElement('div');
  st.className = 'tstate';
  const dot = document.createElement('i');
  dot.className = 'cdot';
  const txt = document.createElement('span');
  st.append(dot, txt);
  meta.append(name, st);
  el.append(q, meta);
  el._parts = { q, name, st, txt, dot, fill: null, badge: null,
                icon: null, lvl: null };

  // Bound once, reading el._o when they fire. This is the whole reason a redraw
  // can leave the element alone: rebinding on every pass would be most of the
  // cost of rebuilding it.
  q.onclick = ev => {
    ev.stopPropagation();
    if (el._o.onQuick) { el._o.onQuick(q); }
  };
  const open = () => { if (el._o.onOpen) { el._o.onOpen(); } };
  el.onclick = open;
  el.onkeydown = ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
  };
  armDrag(el);

  // The entry animation belongs to .fresh and is dropped as soon as it has
  // run. Left on the element it would replay every time the tile is moved
  // between rooms - inserting a node restarts its CSS animations - which is
  // exactly the flashing this rewrite is here to stop.
  el.addEventListener('animationend', ev => {
    if (ev.target === el) { el.classList.remove('fresh'); }
  });
  // animationend does not fire in a tab that was never painted - a background
  // tab freezes its animations - and a stuck .fresh would replay the entry
  // animation on every move for the life of the page. The timer is the floor.
  setTimeout(() => el.classList.remove('fresh'), 2000);
  return el;
}

function paintTile(el, o) {
  el._o = o;
  const p = el._parts;

  el.classList.toggle('on', o.cls === 'on');
  el.classList.toggle('unknown', o.cls === 'unknown');
  el.classList.toggle('locked', o.cls === 'locked');
  setAttr(el, 'title', o.openTitle || 'open settings');

  // innerHTML re-parses the svg, so it is guarded by what is already drawn.
  if (p.icon !== o.icon) { p.q.innerHTML = o.icon; p.icon = o.icon; }
  setAttr(p.q, 'title', o.quickTitle);
  setAttr(p.q, 'aria-label', o.quickTitle);
  if (p.q.disabled !== !!o.quickDisabled) { p.q.disabled = !!o.quickDisabled; }

  setText(p.name, o.name);
  setText(p.txt, o.state);
  p.dot.style.display = o.dot ? 'inline-block' : 'none';
  if (o.dot) { p.dot.style.background = o.dot; }

  // A level of 0 is "off" and draws nothing; null is "this device has no level"
  // (a switch), which is not the same thing.
  if (o.level) {
    if (!p.fill) {
      p.fill = document.createElement('div');
      p.fill.className = 'fill';
      el.append(p.fill);
    }
    if (p.lvl !== o.level) { p.fill.style.setProperty('--lvl', o.level); p.lvl = o.level; }
    // At the top there is nothing above the line for it to separate, so it
    // stops being a level marker and becomes a stray rule along the edge.
    p.fill.classList.toggle('full', o.level >= 0.995);
  } else if (p.fill) {
    p.fill.remove();
    p.fill = null;
    p.lvl = null;
  }

  if (o.badge) {
    if (!p.badge) {
      p.badge = document.createElement('span');
      p.badge.className = 'tbadge';
      el.append(p.badge);
    }
    setText(p.badge, o.badge);
    el.classList.add('badged');
  } else if (p.badge) {
    p.badge.remove();
    p.badge = null;
    el.classList.remove('badged');
  }
}

function tileFor(o) {
  let el = DOM.tiles.get(o.node);
  if (!el) {
    el = buildTile(o);
    // Staggered, but only for the tiles that arrive together on the first
    // paint. One tile appearing later has nothing to be staggered against, and
    // making it wait most of a second before showing up would just look broken.
    if (DOM.firstPaint) {
      el.style.animationDelay = Math.min(DOM.fresh++, 24) * 35 + 'ms';
    }
    DOM.tiles.set(o.node, el);
  }
  paintTile(el, o);
  return el;
}

/* How a measurement is written. The names, units and scales all come from the
 * server, so adding a cluster is one line there and nothing here. */
function measureLabel(key) {
  const m = ((state.devices || {}).measures || []).find(x => x.key === key);
  return m ? m.label : key;
}

function measureText(key, val) {
  if (val === null || val === undefined) { return '\u2014'; }
  if (key === 'airquality') {
    const words = (state.devices || {}).airQualityWords || [];
    return words[val] || ('level ' + val);
  }
  const m = ((state.devices || {}).measures || []).find(x => x.key === key);
  const unit = m && m.unit ? ' ' + m.unit : '';
  return (typeof val === 'number' ? val : String(val)) + unit;
}

// The one worth putting on a tile, which has room for one. Air quality first
// because it is the summary the others feed; then whatever is left, in the
// order the server lists them.
function headlineMeasure(measured) {
  const order = ((state.devices || {}).measures || []).map(m => m.key);
  const keys = Object.keys(measured || {});
  if (keys.includes('airquality')) { return 'airquality'; }
  return order.find(k => keys.includes(k)) || null;
}

function deviceOpts(d) {
  const st = state.bulbs[String(d.node)];
  const measured = (st && st.measured) || null;
  const head = measured ? headlineMeasure(measured) : null;

  let text;
  if (head) { text = `${measureLabel(head)} ${measureText(head, measured[head])}`; }
  else if (st && st.ok === false) { text = 'no answer'; }
  else if (st) { text = d.kind || 'device'; }
  else { text = 'reading\u2026'; }

  return {
    node: d.node,
    icon: ICONS.sensor,
    cls: st && st.ok === false ? 'unknown' : '',
    name: d.name,
    state: text,
    // Nothing to toggle: these are read, not commanded. The quick action is the
    // one thing that always applies - make it show you which one it is.
    quickTitle: 'identify \u2014 ' + d.name,
    onQuick: q => identifySwitch(d, q),
    openTitle: 'readings for ' + d.name,
    onOpen: () => openDevice(d),
  };
}

function bulbOpts(b) {
  const st = state.bulbs[String(b.node)];
  const on = st ? st.on : undefined;
  const known = on === true || on === false;
  // Perceptual, like every other percentage on the page. It used to be the raw
  // Matter level here and only here, so the same bulb read 40% in its sheet and
  // 11% on its tile - the same light, two scales, and no way to tell which was
  // lying.
  const pct = (st && typeof st.level === 'number')
    ? Math.round(perceived(st.level) * 100) + '%' : null;

  let text;
  if (known) { text = on ? (pct ? 'on · ' + pct : 'on') : 'off'; }
  else if (st) { text = 'no answer'; }
  else { text = 'reading…'; }

  // How high the tile fills. On with no level read back fills completely: we
  // know it is lit and nothing more, and a half-full tile would be a number we
  // invented.
  // And the fill, so the tile and the sheet's panel stand at the same height for
  // the same bulb. The floor keeps a bulb that is on but at its minimum from
  // looking off.
  const lvl = on !== true ? 0
    : (st && typeof st.level === 'number' ? Math.max(0.05, perceived(st.level)) : 1);

  return {
    node: b.node,
    level: lvl,
    // The colour the bulb is actually running at, as a dot on the tile.
    // Brightness alone does not tell you how much light there is: the same
    // level 254 at 2200 K is one channel of the LEDs and a fraction of the
    // output it gives at 4000 K. Without this, "full brightness and still dim"
    // has no visible explanation anywhere on the page.
    dot: (on === true && st && st.mireds) ? ctColor(st.mireds) : '',
    icon: ICONS.bulb,
    // "not read yet" is not "did not answer", and neither is "off". A bulb out
    // of range must never look like a bulb somebody switched off - you would
    // walk over and press a switch that is already in the right position.
    cls: on === true ? 'on' : (st && !known ? 'unknown' : ''),
    name: b.name,
    state: text,
    quickTitle: (on === true ? 'turn off' : 'turn on') + ' — ' + b.name,
    onQuick: q => toggleBulb(b, q),
    openTitle: 'settings for ' + b.name,
    onOpen: () => openBulb(b),
  };
}

function switchOpts(sw) {
  const lk = state.locks[String(sw.node)] || {};
  const isLock = lk.role === 1 || sw.role === 'lock';
  const bound = state.bySwitch[String(sw.node)] || [];
  const n = new Set(bound.map(e => e.node)).size;
  const locked = lk.locked;
  const known = locked === true || locked === false;

  return {
    node: sw.node,
    // A padlock either way, because this button locks and unlocks - closed when
    // it is locked, open when it is not. It used to show the switch icon while
    // unlocked, which described the device rather than what pressing it would
    // do, so the only clue to the action was a tooltip. A lock-role switch
    // keeps the device icon: its button identifies rather than locks.
    icon: isLock ? ICONS.switch : (locked ? ICONS.lock : ICONS.unlock),
    cls: locked ? 'locked' : '',
    name: sw.name,
    state: isLock ? `locks ${n} switch${n === 1 ? '' : 'es'}`
                  : `${n} bulb${n === 1 ? '' : 's'}`,
    badge: isLock ? 'lock' : (locked ? 'locked' : ''),
    // A lock cannot lock itself: it would leave you no way to unlock the rest
    // from the wall. So its quick action is the other useful one - blink it, so
    // you know which of them it is.
    quickTitle: isLock ? 'identify — ' + sw.name
      : (locked ? 'unlock ' : 'lock ') + sw.name,
    quickDisabled: !isLock && !known,
    onQuick: q => (isLock ? identifySwitch(sw, q) : quickLock(sw, q)),
    openTitle: 'settings for ' + sw.name,
    onOpen: () => openSwitch(sw),
  };
}

function buildToolbar() {
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';

  const acts = document.createElement('div');
  acts.className = 'rooms';
  const act = (label, fn, cls) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  };
  // Adding and the schedule live in the header now - see .hdr-acts. What is
  // left here acts on what is already on the page.

  // Only worth showing with more than one switch, so they are built now and
  // attached or detached later.
  DOM.lockAll = [act('lock all', ev => setLockAll(true, ev.target), 'bulk'),
                 act('unlock all', ev => setLockAll(false, ev.target), 'bulk')];

  const sizer = document.createElement('div');
  sizer.className = 'sizer';
  DOM.sizer = [['s', ICONS.sizeS, 'small tiles'],
               ['m', ICONS.sizeM, 'medium tiles'],
               ['l', ICONS.sizeL, 'large tiles']].map(([v, ico, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.size = v;
    b.innerHTML = ico;
    b.title = label;
    b.setAttribute('aria-label', label);
    b.onclick = () => setTileSize(v);
    sizer.append(b);
    return b;
  });

  toolbar.append(acts, sizer);
  toolbar._acts = acts;
  return toolbar;
}

function paintToolbar() {
  const acts = DOM.toolbar._acts;
  const want = state.switches.length > 1;
  const has = DOM.lockAll[0].parentNode === acts;
  if (want && !has) { acts.append(...DOM.lockAll); }
  else if (!want && has) { DOM.lockAll.forEach(b => b.remove()); }
  DOM.sizer.forEach(b => b.classList.toggle('on', b.dataset.size === tileSize));
  // The header is static markup, so its state is painted from here.
  const sched = $('#go-sched');
  if (sched) { sched.classList.toggle('on', state.view === 'schedule'); }
}

function buildSection(name) {
  const sec = document.createElement('section');
  sec.className = 'room';
  sec.dataset.room = name;

  const head = document.createElement('div');
  head.className = 'section-label';
  const t = document.createElement('span');
  t.textContent = name || 'no room';
  const rule = document.createElement('span');
  rule.className = 'rule';
  const count = document.createElement('span');
  count.className = 'count';
  head.append(t, rule, count);

  // "no room" is where devices land when they belong nowhere. There is nothing
  // to rename and nothing to delete, so it gets no wrench.
  if (name) {
    const w = document.createElement('button');
    w.type = 'button';
    w.className = 'chip-edit';
    w.innerHTML = ICONS.wrench;
    w.title = 'rename or delete ' + name;
    w.setAttribute('aria-label', 'rename or delete ' + name);
    w.onclick = () => editRoom(name);
    head.append(w);
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.append(head, grid);
  sec._parts = { count, grid, empty: null };
  return sec;
}

function sectionFor(name) {
  let sec = DOM.sections.get(name);
  if (!sec) { sec = buildSection(name); DOM.sections.set(name, sec); }
  return sec;
}

/* Where a device sits in its room.
 *
 * `pos` is written by a drop and is the only thing that decides order once it
 * exists. Devices without one - an install that has never been rearranged, or a
 * device commissioned into a room that has - fall back to the original rule,
 * switches before bulbs in devices.json order, and sort after everything that
 * has been placed by hand. So a house nobody has touched looks exactly as it
 * did, and a newly added device turns up at the end rather than in the middle.
 */
function orderOf(d, i, isSwitch) {
  return typeof d.pos === 'number' ? d.pos
                                   : 1e6 + (isSwitch ? 0 : 1e3) + i;
}

// The devices of one room, in the order they are drawn.
/* Every device in the house, whatever it is.
 *
 * Switches and bulbs keep their own arrays because the binding table, the ACL
 * and the schedule are genuinely switch-and-bulb logic. Everything else lives
 * in one open list, so adding a kind of thing is a line in the type table on
 * the server rather than a branch here. */
function allDevices() {
  const d = state.devices || {};
  return [...state.switches, ...(d.bulbs || []), ...(d.devices || [])];
}

function roomMembers(name) {
  const mine = d => (d.where || '') === name;
  const out = [];
  state.switches.forEach((d, i) => {
    if (mine(d)) { out.push({ d, key: orderOf(d, i, true), opts: switchOpts }); }
  });
  (state.devices.bulbs || []).forEach((d, i) => {
    if (mine(d)) { out.push({ d, key: orderOf(d, i, false), opts: bulbOpts }); }
  });
  // Everything else, after the two kinds that have a hand-placed default order.
  (state.devices.devices || []).forEach((d, i) => {
    if (mine(d)) { out.push({ d, key: orderOf(d, i + 2000, false), opts: deviceOpts }); }
  });
  out.sort((a, b) => a.key - b.key);
  return out;
}

function render() {
  const root = $('#content');
  if (!state.devices) { return; }

  // A redraw in the middle of a drag would move the ground under the finger -
  // and, before this was reconciliation, would delete the element being
  // dragged outright. Defer it to the drop.
  if (DRAG.live) { DRAG.dirty = true; return; }

  if (!DOM.toolbar) { DOM.toolbar = buildToolbar(); }
  paintToolbar();

  // The schedule is a page, not a dialog: a whole day, two curves and a list of
  // bulbs do not fit in a box in the middle of the screen, and every pixel of
  // backdrop is a pixel the chart does not get.
  if (state.view === 'schedule') {
    if (!DOM.sched) { DOM.sched = buildScheduleView(); }
    place(root, [DOM.toolbar, DOM.sched]);
    return;
  }

  // --- one section per room ---
  //
  // Rooms are the structure of the page, not a filter over it. Grouping by kind
  // instead - all the switches, then all the bulbs - answers a question nobody
  // asks; you know perfectly well whether you are looking for a lamp. What is
  // not obvious is which room a device ended up in, and that is what the
  // sections make impossible to get wrong.
  //
  // Empty rooms are drawn too. A room you cannot see is a room you cannot drop
  // anything into, and a new one starts empty by definition.
  const all = allDevices();
  const names = (state.devices.rooms || []).slice();
  if (all.some(d => !d.where)) { names.push(''); }

  const sections = names.map(name => {
    const sec = sectionFor(name);
    const members = roomMembers(name).map(m => m.opts(m.d));
    setText(sec._parts.count, members.length);
    if (sec._parts.grid.dataset.size !== tileSize) {
      sec._parts.grid.dataset.size = tileSize;
    }

    const want = members.map(tileFor);
    if (!members.length) {
      if (!sec._parts.empty) {
        const e = document.createElement('div');
        e.className = 'empty-room';
        e.textContent = 'empty — drag a device here';
        sec._parts.empty = e;
      }
      want.push(sec._parts.empty);
    }
    place(sec._parts.grid, want);
    return sec;
  });

  // --- the raw response, for when parsing does not catch the format ---
  if (state.raw && !DOM.raw) {
    DOM.raw = document.createElement('details');
    DOM.raw.className = 'raw';
  }
  if (state.raw) {
    DOM.raw.innerHTML = `<summary>raw chip-tool response</summary>
                         <pre>${JSON.stringify(state.raw, null, 2)}</pre>`;
  }

  place(root, [DOM.toolbar, ...sections, ...(state.raw ? [DOM.raw] : [])]);

  // Anything no longer on screen stops being remembered, or a device deleted
  // from devices.json would keep its element alive for the life of the tab.
  for (const [k, el] of DOM.tiles) { if (!el.isConnected) { DOM.tiles.delete(k); } }
  for (const [k, el] of DOM.sections) { if (!el.isConnected) { DOM.sections.delete(k); } }
  DOM.firstPaint = false;
}

/* ---------- what a tile does when you press its icon ---------- */

async function toggleBulb(b, q) {
  q.classList.add('busy');
  q.disabled = true;
  // Ask for the state we want, not for a toggle, whenever we know where it is:
  // two clicks in a row on a slow bulb would otherwise cancel each other out.
  // With no idea, toggle is the only honest thing to send.
  const cur = (state.bulbs[String(b.node)] || {}).on;
  const action = cur === true ? 'off' : cur === false ? 'on' : 'toggle';

  const j = await setLight(b.node, b.endpoint ?? 1, action);
  // The tile survives a redraw now, so whatever we put on the button we take
  // off ourselves - it is no longer swept away by the element being replaced.
  q.disabled = false;
  q.classList.remove('busy');
  if (j.error) {
    q.classList.add('failed');
    setStatus(j.error, 'err');
    setTimeout(() => q.classList.remove('failed'), 3000);
    return;
  }
  render();
}

/* One command to a bulb, plus the state it read back.
 *
 * The server re-reads the bulb after every command and returns what it found.
 * A confirmed command is not proof the bulb obeyed, and here you are looking
 * straight at the bulb - showing "on" for a bulb that stayed dark is worse than
 * showing nothing. */
async function setLight(node, endpoint, action) {
  let j;
  try {
    j = await (await api('/api/light', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ node: Number(node), endpoint: Number(endpoint), action })
    })).json();
  } catch (err) { j = { error: String(err) }; }

  if (!j.error) { adoptBulb(node, j); }
  return j;
}

/* What the server read back off the bulb after a command, into our copy.
 *
 * It is a read, not an assumption: the server re-reads the device before
 * answering, precisely because a confirmed command is not proof the bulb
 * obeyed - and with a bulb you are looking straight at, showing the value you
 * asked for instead of the one you got is the expensive kind of wrong. */
/* Why the light moved on its own.
 *
 * A change by hand holds the bulb until the light is switched off. After that
 * the schedule has it back, so the next time it comes on it is the curve's
 * value and not yours. That is the rule working exactly as intended, and from
 * in front of the lamp it is indistinguishable from the panel changing its own
 * mind. The only thing missing was somebody saying so.
 *
 * It is remembered at the release and SAID AT THE NEXT POWER-ON, immediately
 * before the controls jump. Said at the release it explained nothing: the lamp
 * was going dark, nothing moved, and by the time anything did the message was
 * long gone. The movement and its explanation have to arrive together, in that
 * order.
 *
 * The release is watched as a transition rather than a state, because "held"
 * being false tells you nothing on its own - almost every bulb is unheld almost
 * all the time. That also catches the two other ways a hold can end, the
 * three-hour ceiling and a schedule save, which are just as puzzling. */
const TOOKOVER = {};
let tookoverTimer = null;

function noteHeld(node, was, now) {
  const k = String(node);
  if (was === true && now === false) { TOOKOVER[k] = true; }
  // A fresh hold means they have taken the light back; nothing to explain.
  if (now === true) { delete TOOKOVER[k]; }
}
// The repaint of whichever sheet is open, so a poll can keep it honest, and
// the way to make it explain itself when the light comes on from the wall.
let SHEET_LIVE = null;
let SHEET_SAY = null;

function noteReleases(prev, next) {
  for (const [node, b] of Object.entries(next || {})) {
    if (b) { noteHeld(node, (prev[node] || {}).held, b.held); }
  }
}

// "The schedule took this light while it was off, and it has just come on."
function tookoverNow(node, on) {
  const cur = state.bulbs[String(node)] || {};
  return !!TOOKOVER[String(node)] && cur.on === false && on === true;
}

function adoptBulb(node, j) {
  const cur = state.bulbs[String(node)] || {};
  const next = { ...cur, ok: true };
  if (j.on === true || j.on === false) { next.on = j.on; }
  if (typeof j.level === 'number') { next.level = j.level; }
  if (typeof j.mireds === 'number' && j.mireds) { next.mireds = j.mireds; }
  if (typeof j.onlevel === 'number') { next.onlevel = j.onlevel; }
  if (typeof j.ctMin === 'number' && j.ctMin) { next.ctMin = j.ctMin; }
  if (typeof j.ctMax === 'number' && j.ctMax) { next.ctMax = j.ctMax; }
  if (typeof j.held === 'boolean') { next.held = j.held; }
  noteHeld(node, cur.held, next.held);
  state.bulbs[String(node)] = next;
}

async function quickLock(sw, q) {
  q.classList.add('busy');
  q.disabled = true;
  const ok = await toggleLock(sw.node, null);   // sendLock redraws on its own
  q.classList.remove('busy');
  q.disabled = false;
  if (!ok) {
    q.classList.add('failed');
    setTimeout(() => q.classList.remove('failed'), 3000);
  }
}

/* Identify from a tile, which cannot use identify() - that one counts down in
 * the button's text, and this button's content is an svg. Setting textContent
 * on it would delete the icon and never bring it back.
 *
 * The beacon animation says it better anyway: it is the same amber pulse, at
 * the same rhythm, as the LED on the wall. */
async function identifySwitch(sw, q) {
  const seconds = 15;
  q.disabled = true;
  q.classList.add('busy');
  let j;
  try {
    j = await (await api('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ node: sw.node, endpoint: sw.endpoint ?? 1, seconds })
    })).json();
  } catch (err) { j = { error: String(err) }; }

  if (j.error) {
    q.classList.remove('busy');
    q.classList.add('failed');
    setStatus(j.error, 'err');
    setTimeout(() => { q.classList.remove('failed'); q.disabled = false; }, 2500);
    return;
  }
  setTimeout(() => { q.classList.remove('busy'); q.disabled = false; }, seconds * 1000);
}

/* ---------- the settings sheet behind a tile ---------- */

function sheetActions(dev, extra) {
  return `<div class="actions">${extra || ''}
    <button class="id">identify</button>
    <button class="share">share</button>
    <button class="forget" type="button">remove</button>
  </div>
  <div class="forget-note" hidden></div>`;
}

/* Removing a device, in two presses.
 *
 * Not a confirm() and not a second dialog: the button says what it is about to
 * do and the sentence underneath says what that costs, which is the part
 * nobody can guess. Unpairing is not "take it off the list" - it hands the
 * device back, and getting it into another system means a factory reset first.
 * Disarms itself after a few seconds, so an armed button is never left lying
 * around for the next person to press. */
function wireForget(sheet, dev) {
  const btn = sheet.querySelector('.forget');
  const note = sheet.querySelector('.forget-note');
  if (!btn) { return; }
  let armed = null;

  const disarm = () => {
    clearTimeout(armed);
    armed = null;
    btn.classList.remove('armed');
    btn.textContent = 'remove';
    note.hidden = true;
  };

  btn.onclick = async () => {
    if (!armed) {
      btn.classList.add('armed');
      btn.textContent = 'remove for good?';
      note.hidden = false;
      note.innerHTML = `<b>${dev.name}</b> is unpaired from the fabric and taken
        out of the house &mdash; along with any switch that drives it and any
        schedule of its own. To use it again, anywhere, it has to be factory
        reset first.`;
      armed = setTimeout(disarm, 6000);
      return;
    }
    clearTimeout(armed);
    btn.disabled = true;
    btn.textContent = 'removing…';
    let j;
    try {
      j = await (await api('/api/forget', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node: dev.node })
      })).json();
    } catch (err) { j = { error: String(err) }; }
    btn.disabled = false;
    if (j.error) {
      disarm();
      note.hidden = false;
      note.innerHTML = `<span class="bad">not removed: ${j.error}</span>`;
      return;
    }
    closeSheet();
    setStatus(j.unpaired
      ? `${j.name} removed`
      : `${j.name} removed here, but it did not answer the unpair \u2014 factory reset it before using it elsewhere`,
      j.unpaired ? 'ok' : 'warn');
    load();
  };
}

function wireActions(sheet, dev) {
  const idb = sheet.querySelector('.id');
  idb.dataset.node = dev.node;
  idb.dataset.endpoint = dev.endpoint ?? 1;
  idb.onclick = () => identify(idb);

  const shb = sheet.querySelector('.share');
  shb.dataset.node = dev.node;
  shb.dataset.name = dev.name;
  shb.onclick = () => share(shb);

  wireForget(sheet, dev);
}

function openBulb(b) {
  const sheet = $('#sheet');
  const drivers = state.switches.filter(sw =>
    (state.bySwitch[String(sw.node)] || []).some(e => String(e.node) === String(b.node)));

  sheet.innerHTML = `
    <h2></h2>
    <div class="who"></div>
    <div class="hk">
      <div class="hk-pad">
        <div class="hk-lvl" id="hk-lvl">
          <div class="hk-fill"></div>
          <div class="hk-face">
            <span class="hk-ico">${ICONS.bulb}</span>
            <span class="hk-pct"></span>
          </div>
        </div>
        <div class="hk-cap" id="cap-lvl"></div>
      </div>
      <div class="hk-pad">
        <div class="hk-ct" id="hk-ct"><div class="hk-knob"></div></div>
        <div class="hk-cap" id="cap-ct"></div>
      </div>
    </div>
    ${sheetActions(b)}
    <div class="links" id="drivers"></div>
    <div class="links" id="sched-of"></div>`;

  nameable(sheet, b, () => openBulb(b));
  sheet.querySelector('.who').textContent =
    `bulb · node ${b.node}` + (b.where ? ` · ${b.where}` : '');

  const lvlBox = sheet.querySelector('#hk-lvl');
  const ctBox = sheet.querySelector('#hk-ct');
  const fill = sheet.querySelector('.hk-fill');
  const knob = sheet.querySelector('.hk-knob');
  const pct = sheet.querySelector('.hk-pct');
  const capL = sheet.querySelector('#cap-lvl');
  const capC = sheet.querySelector('#cap-ct');

  /* The strip's travel is THIS BULB's range, not the Matter range.
   *
   * The spec allows 153..500 mireds; this lamp reports 153..454 and silently
   * clamps anything warmer. So the bottom eighth of the slider did nothing -
   * you dragged into it and the value sprang back as soon as it was read again.
   * Springing back is the right behaviour when a bulb refuses something, and it
   * is still there as the backstop; it is the wrong way to find out that a
   * eighth of a control is decorative.
   *
   * Until the bulb has been read we use the Matter range, which is the widest
   * anything could be - narrowing later only ever removes travel that was not
   * doing anything. */
  const ctLo = () => (state.bulbs[String(b.node)] || {}).ctMin || MIRED_MIN;
  const ctHi = () => (state.bulbs[String(b.node)] || {}).ctMax || MIRED_MAX;
  const paintStrip = () => {
    const lo = ctLo();
    const hi = ctHi();
    const at = f => ctColor(hi - f * (hi - lo));
    ctBox.style.background = `linear-gradient(0deg, ${at(0)}, ${at(.33)}, ` +
      `${at(.5)}, ${at(.67)}, ${at(1)})`;
  };
  paintStrip();

  // What the two controls are showing, while a drag is in progress. null means
  // "whatever the bulb says"; a number means the finger is in charge.
  let dragLvl = null;
  let dragCt = null;

  /* Which brightness to show.
   *
   * A bulb that is OFF reports CurrentLevel 1 - that is its off reading, not a
   * setting - so showing it made the control read 4% while off and 25% the
   * moment you switched it on, as though pressing ON had also changed the
   * brightness. While off, the honest number is OnLevel: what it will come up
   * at, which is also what dragging the control is about to change. */
  const shownNorm = () => {
    if (dragLvl !== null) { return dragLvl; }
    const cur = state.bulbs[String(b.node)] || {};
    if (cur.on === true && typeof cur.level === 'number') { return perceived(cur.level); }
    if (typeof cur.onlevel === 'number') { return perceived(cur.onlevel); }
    return typeof cur.level === 'number' ? perceived(cur.level) : 0;
  };
  const shownMireds = () => {
    if (dragCt !== null) { return dragCt; }
    const cur = state.bulbs[String(b.node)] || {};
    return Math.min(ctHi(), Math.max(ctLo(), cur.mireds || 370));
  };

  /* Said in the line that names the bulb, because that is where the eye
   * already is, and because a line that swaps its own contents is noticed
   * where a new box appearing lower down is not. It fades out, says its piece
   * for three seconds, and fades back to the identity - so it interrupts
   * without costing anything permanent. */
  const whoBox = sheet.querySelector(".who");
  const whoIs = `bulb · node ${b.node}` + (b.where ? ` · ${b.where}` : "");

  const fadeWho = (text, amber, then) => {
    whoBox.classList.add("gone");
    clearTimeout(tookoverTimer);
    tookoverTimer = setTimeout(() => {
      whoBox.textContent = text;
      whoBox.classList.toggle("said", !!amber);
      whoBox.classList.remove("gone");
      if (then) { tookoverTimer = setTimeout(then, 3000); }
    }, 260);
  };

  // Resolves once the message is fully IN - a crossfade is 260ms out and 260ms
  // back, so resolving at 300 handed the controls back while the message was
  // still arriving and they moved together. It has to be legible first, then
  // they move. The identity returns three seconds later, by which time the
  // sliders are long since settled.
  const SAY_LEAD = 540;
  const sayTookover = () => new Promise(resolve => {
    fadeWho("values updated by the schedule", true, () => fadeWho(whoIs, false));
    setTimeout(resolve, SAY_LEAD);
  });

  const paintCtl = () => {
    const cur = state.bulbs[String(b.node)] || {};
    const on = cur.on === true;
    const v = Math.max(0, Math.min(1, shownNorm()));
    const mir = shownMireds();

    // Both controls, not just the brightness one. A dark lamp showing a full
    // blue-to-amber colour strip reads as live equipment - the one control
    // still in colour is the one the eye goes to, which is exactly backwards.
    lvlBox.classList.toggle('off', !on);
    ctBox.classList.toggle('off', !on);
    sheet.querySelector('.hk').classList.toggle('off', !on);
    fill.style.height = (v * 100).toFixed(1) + '%';
    fill.classList.toggle('full', v >= 0.995);
    pct.textContent = Math.round(v * 100) + '%';
    // "held" is worth a word, because otherwise the next question is why the
    // schedule has stopped touching this lamp. It is shown while the lamp is
    // dark too: a hold set on a dark lamp is waiting for its power-on, and
    // hiding it there meant the one state you could not see was the one that
    // outlives the moment you set it.
    capL.textContent = cur.held ? (on ? 'on · held' : 'off · held')
      : on ? 'on' : (cur.on === false ? 'off' : '\u2014');
    capL.title = cur.held
      ? 'set by hand — the schedule leaves it alone until you switch it off' : '';

    // The handle's travel is inset by its own height, so at either end it sits
    // fully inside the strip. Positioned by its centre it was drawn half
    // outside at the top and clipped by the rounded corner, which read as the
    // control running past its own limit.
    const lo = ctLo();
    const hi = ctHi();
    knob.style.setProperty('--p', hi > lo ? (hi - mir) / (hi - lo) : 0);
    capC.textContent = `${kelvin(mir)} K`;
    capC.title = ctWord(mir);
  };
  paintCtl();
  SHEET_LIVE = paintCtl;
  SHEET_SAY = { node: b.node, say: sayTookover };

  const send = async payload => {
    const box = sheet.querySelector('.hk');
    box.classList.add('busy');
    let j;
    try {
      j = await (await api('/api/light', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node: b.node, endpoint: b.endpoint ?? 1, ...payload })
      })).json();
    } catch (err) { j = { error: String(err) }; }
    box.classList.remove('busy');
    dragLvl = null;
    dragCt = null;
    if (j.error) { paintCtl(); return setStatus(j.error, 'err'); }
    // The explanation goes first. Adopting the new state repaints the controls,
    // and the whole point is that the message is already there when they move.
    if (tookoverNow(b.node, j.on)) {
      delete TOOKOVER[String(b.node)];
      await sayTookover();
    }
    adoptBulb(b.node, j);
    paintStrip();
    paintCtl();
    render();
  };

  /* One gesture, two meanings, told apart by whether it moved.
   *
   * Drag the panel and it sets the value; press and let go without moving and it
   * toggles the light. That is how the same control does both on a phone, and it
   * is why there is no separate on/off pair here any more: two buttons whose job
   * the big control already does, taking up the room the control wanted.
   *
   * Sends on RELEASE. A control that fires while you drag puts a hundred
   * commands on the radio for one gesture and the bulb only shows the last.
   *
   * The drag is ABSOLUTE: the level follows the pointer, so letting go at
   * four-fifths up the panel means four-fifths. That is the whole point of a
   * control shaped like a column, and anything else fights what it looks like.
   *
   * It was relative for a while, to stop a click that twitched six pixels from
   * becoming "set 2%". That fixed the twitch and broke the gesture: a short,
   * deliberate drag moved the value by only the distance travelled, so it
   * landed roughly where it already was - which is the value you picked LAST
   * time. Aim for 80, get the old value; aim for 20, get 80; aim for 50, get
   * 20. A control one step behind is worse than one that occasionally
   * overshoots.
   *
   * So it is absolute again, and the twitch is handled where it belongs: at
   * the threshold. Twelve pixels is far more than a click carries and far less
   * than a drag, so a press that means "toggle" stays a toggle. */
  const SLOP = 12;
  const grab = (el, opts) => {
    let moved = false;
    let startY = 0;
    el.onpointerdown = ev => {
      ev.preventDefault();
      moved = false;
      startY = ev.clientY;
      el.setPointerCapture(ev.pointerId);
      el.classList.add('grabbed');
    };
    el.onpointermove = ev => {
      if (!el.hasPointerCapture || !el.hasPointerCapture(ev.pointerId)) { return; }
      if (!moved && Math.abs(ev.clientY - startY) < SLOP) { return; }
      moved = true;
      const r = el.getBoundingClientRect();
      opts.set(Math.max(0, Math.min(1, (r.bottom - ev.clientY) / r.height)));
      paintCtl();
    };
    const up = ev => {
      if (!el.hasPointerCapture || !el.hasPointerCapture(ev.pointerId)) { return; }
      el.releasePointerCapture(ev.pointerId);
      el.classList.remove('grabbed');
      if (moved) { opts.commit(); } else if (opts.tap) { opts.tap(); }
    };
    el.onpointerup = up;
    el.onpointercancel = ev => {
      if (el.hasPointerCapture && el.hasPointerCapture(ev.pointerId)) {
        el.releasePointerCapture(ev.pointerId);
      }
      el.classList.remove('grabbed');
      dragLvl = null;
      dragCt = null;
      paintCtl();
    };
  };

  grab(lvlBox, {
    // A floor of 1%: dragging to the very bottom of a brightness control means
    // "as low as it goes", not "off". Off is the tap.
    set: v => { dragLvl = Math.max(0.01, v); },
    commit: () => send({ level: levelFromPerceived(dragLvl) }),
    tap: () => send({ action: 'toggle' }),
  });

  grab(ctBox, {
    set: v => { dragCt = Math.round(ctHi() - v * (ctHi() - ctLo())); },
    commit: () => send({ mireds: dragCt }),
  });

  /* Which schedule this bulb answers to.
   *
   * Every bulb a switch drives is written to by the schedule every minute, and
   * until this row existed nothing on the bulb's own sheet said so - you could
   * watch a lamp change by itself with no way to find out what was doing it,
   * let alone which curve.
   *
   * Asked for separately because the tile state does not carry it, and it is
   * one small read of a file on the Pi. */
  const schedBox = sheet.querySelector('#sched-of');
  (async () => {
    let d;
    try { d = await (await api('/api/schedule')).json(); } catch (err) { return; }
    if (d.error) { return; }
    const gov = (d.governed || []).find(g => g.node === b.node);
    const schedRows = sheetList(schedBox, 'affected by schedule');
    if (!gov) {
      // Only reachable now if the bulb has just been removed from under us -
      // every bulb the panel knows about is on the schedule, bound or not.
      schedRows.remove();
      schedBox.insertAdjacentHTML('beforeend',
        '<div class="empty">no schedule reaches this bulb</div>');
      return;
    }
    schedRows.append(linkRow(gov.own ? 'its own schedule' : 'the house schedule',
                             () => editSchedule({ nodes: [b.node] })));
  })();

  const list = sheet.querySelector('#drivers');
  const driverRows = sheetList(list, 'controlled by');
  if (drivers.length) {
    drivers.forEach(sw => driverRows.append(
      linkRow(sw.name, () => openSwitch(sw), '', sw.where)));
  } else {
    list.insertAdjacentHTML('beforeend',
      '<div class="empty">no switch is bound to this bulb</div>');
  }
  sheetListDone(list);

  wireActions(sheet, b);
  $('#overlay').classList.add('on');
}

/* A device the panel reads rather than commands.
 *
 * No controls, because there are none to offer: a sensor answers questions. So
 * the sheet is its readings, what it says it is, and the two things that apply
 * to every device on the fabric - make it identify itself, and hand it to
 * another ecosystem. */
function openDevice(d) {
  const sheet = $('#sheet');
  const st = state.bulbs[String(d.node)] || {};
  const measured = st.measured || {};
  const keys = ((state.devices || {}).measures || [])
    .map(m => m.key).filter(k => k in measured);

  sheet.innerHTML = `
    <h2></h2>
    <div class="who"></div>
    <div class="reads" id="reads"></div>
    ${sheetActions(d)}`;

  nameable(sheet, d, () => openDevice(d));
  sheet.querySelector('.who').textContent =
    `${d.kind || 'device'} · node ${d.node}` + (d.where ? ` · ${d.where}` : '');

  /* The readings, repainted in place.
   *
   * In place and not by rebuilding the sheet, which is what it did at first -
   * and since rebuilding it also kicked off the fresh read that rebuilt it, the
   * sheet redrew itself forever. The visible symptom was the buttons flickering
   * under the pointer, because every pass destroyed and recreated them; the
   * invisible one was a sensor being polled in a loop. */
  const box = sheet.querySelector('#reads');
  const paintReads = () => {
    const cur = (state.bulbs[String(d.node)] || {});
    const vals = cur.measured || {};
    const rows = ((state.devices || {}).measures || [])
      .map(m => m.key).filter(k => k in vals);
    box.innerHTML = '';
    if (!rows.length) {
      // The three reasons there is nothing here are different, and which one it
      // is decides what you do about it.
      const described = Object.values(((d.desc || {}).endpoints) || {})
        .some(e => (e.clusters || []).length);
      box.innerHTML = `<div class="empty">${cur.ok === false ? 'not answering'
        : !described ? 'it did not describe itself when it was added'
        : 'nothing read from it yet'}</div>`;
      return;
    }
    rows.forEach(k => {
      const row = document.createElement('div');
      row.className = 'read';
      row.innerHTML = '<span class="k"></span><span class="v"></span>';
      row.querySelector('.k').textContent = measureLabel(k);
      row.querySelector('.v').textContent = measureText(k, vals[k]);
      box.append(row);
    });
  };
  paintReads();

  wireActions(sheet, d);
  $('#overlay').classList.add('on');

  // ONE fresh read, and only the numbers are repainted with it. A sheet that is
  // open is somebody looking, so the readings are worth being current; a sheet
  // that reopens itself to show them is a loop.
  loadBulbs(true).then(() => { if (box.isConnected) { paintReads(); } });
}

function openSwitch(sw) {
  const sheet = $('#sheet');
  const lk = state.locks[String(sw.node)] || {};
  const isLock = lk.role === 1 || sw.role === 'lock';
  const bound = state.bySwitch[String(sw.node)] || [];
  const byNode = {};
  for (const e of bound) { (byNode[e.node] ||= []).push(e.cluster); }

  sheet.innerHTML = `
    <h2></h2>
    <div class="who"></div>
    ${isLock ? '' : `<div class="series big" id="lockpick">
      <button data-lock="0">unlocked</button>
      <button data-lock="1">locked</button>
    </div>`}
    <div class="links" id="links"></div>
    ${sheetActions(sw, `
      <button class="edit" data-go="bind">bindings</button>`)}`;

  nameable(sheet, sw, () => openSwitch(sw));
  sheet.querySelector('.who').textContent =
    `${isLock ? 'lock' : 'switch'} · node ${sw.node}` +
    (sw.where ? ` · ${sw.where}` : '');

  const list = sheet.querySelector('#links');
  // What the tail lists is the BINDING TABLE - the clusters this switch is
  // wired to command - not what a press does. A press only ever toggles;
  // brightness and colour are the long press, which sets full brightness at
  // 4000 K once (automation.cpp, OnButtonLongPress). Listing all three with
  // nothing to separate them read as "this switch dims", which it does not.
  const rows = sheetList(list,
    isLock ? 'locks these switches' : 'controls directly',
    isLock ? '' : 'a press toggles &middot; hold for full brightness at 4000&nbsp;K');
  if (Object.keys(byNode).length) {
    for (const [node, clusters] of Object.entries(byNode)) {
      const tail = clusters.map(c => CLUSTER_NAMES[c] || ('cluster ' + c)).join(' · ');
      // A lock's targets are switches, everything else's are bulbs - so the row
      // opens whichever kind it is actually naming.
      const target = isLock
        ? state.switches.find(x => String(x.node) === String(node))
        : (state.devices.bulbs || []).find(x => String(x.node) === String(node));
      const name = isLock ? switchName(node) : bulbName(node);
      if (!target) {
        // In the binding table but not in devices.json: nothing to open, and
        // saying so is better than a link that does nothing.
        const dead = document.createElement('div');
        dead.className = 'link-row';
        dead.innerHTML = `<span class="arrow">&rarr;</span>
                          <span class="nmwrap"><span class="nm"></span>
                          <span class="rm"></span></span>
                          <span class="cl">${tail}</span>`;
        dead.querySelector('.nm').textContent = name;
        rows.append(dead);
        continue;
      }
      rows.append(linkRow(name,
        () => (isLock ? openSwitch(target) : openBulb(target)),
        tail, target.where));
    }
  } else {
    list.insertAdjacentHTML('beforeend',
      `<div class="empty">no bindings &mdash; this ${isLock ? 'lock locks nothing'
                                                            : 'switch controls no bulb'}</div>`);
  }
  sheetListDone(list);

  const seg = sheet.querySelector('#lockpick');
  if (seg) {
    const paint = () => {
      const cur = (state.locks[String(sw.node)] || {}).locked;
      seg.querySelectorAll('button').forEach(x => {
        const want = x.dataset.lock === '1';
        x.classList.toggle('on', cur === want);
        x.classList.toggle('locked', want);
        x.disabled = cur === null || cur === undefined;
      });
    };
    paint();
    seg.querySelectorAll('button').forEach(x => x.onclick = async () => {
      const want = x.dataset.lock === '1';
      if ((state.locks[String(sw.node)] || {}).locked === want) { return; }
      seg.querySelectorAll('button').forEach(y => y.disabled = true);
      await sendLock({ switches: [sw.node], locked: want }, null);
      paint();
    });
  }

  sheet.querySelector('[data-go="bind"]').onclick = () => editLinks(sw.node);
  // No schedule button here. A switch has no schedule - the Pi writes the
  // curve straight to each bulb over Thread, and which bulbs this particular
  // switch happens to drive has nothing to do with it. The button used to scope
  // the editor to those bulbs, which was the only reading that meant anything
  // while the schedule was reached THROUGH the bindings; now it would just be
  // an arbitrary subset, and it silently fell back to the whole house whenever
  // the switch drove nothing. The schedule lives in the header, and on the
  // sheet of each bulb it actually affects.
  wireActions(sheet, sw);
  $('#overlay').classList.add('on');
}

async function identify(btn) {
  const seconds = 15;
  const original = btn.textContent.trim();
  btn.disabled = true;
  btn.classList.add('busy');

  let left = seconds;
  btn.textContent = left + 's';
  const tick = setInterval(() => {
    btn.textContent = (--left) + 's';
    if (left <= 0) clearInterval(tick);
  }, 1000);

  try {
    const r = await api('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        node: btn.dataset.node,
        endpoint: Number(btn.dataset.endpoint),
        seconds
      })
    });
    const j = await r.json();
    if (j.error) {
      clearInterval(tick);
      btn.textContent = 'error';
      btn.classList.remove('busy');
      console.error(j);
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2500);
      return;
    }
  } catch (e) {
    console.error(e);
  }

  setTimeout(() => {
    clearInterval(tick);
    btn.classList.remove('busy');
    btn.textContent = original;
    btn.disabled = false;
  }, seconds * 1000);
}

// The bulbs grouped by room, with the switch's own room first - that is usually
// where the ones you want are. The rest stay reachable further down.
function renderPick(bulbs, bound, ownRoom, empty = 'no bulbs',
                    ownLabel = 'the switch\'s room') {
  if (!bulbs.length) return `<div class="empty" style="padding:14px">${empty}</div>`;
  const groups = {};
  bulbs.forEach(b => (groups[b.where || ''] ||= []).push(b));
  const names = Object.keys(groups).sort((a, b) => {
    if (a === ownRoom) return -1;
    if (b === ownRoom) return 1;
    return a.localeCompare(b);
  });
  return names.map(r => `
    <div class="group">${r || 'no room'}${r === ownRoom ? ' &middot; ' + ownLabel : ''}</div>
    ${groups[r].map(b => `
      <label>
        <input type="checkbox" value="${b.node}" ${bound.has(b.node) ? 'checked' : ''}>
        <span>${b.name}</span>
        <span class="nid">${b.node}</span>
      </label>`).join('')}`).join('');
}

// ---------- the light schedule ----------
//
// One schedule, and it belongs to the house. It lives on the Pi, which writes
// the level and the colour INTO each bulb when the slot changes; the switch only
// ever sends Toggle. So this is not a program you send to a device - it is what
// the bulbs will be set to, hour by hour.
//
// THE DAY IS COLUMNS. Left edge is 00:00, right edge is 23:59, and the day is
// cut into N equal columns. Adding a column re-divides the whole day; there is
// no such thing as a point at 06:37 any more. That is a real loss of precision
// and a large gain in everything else: every column is the same width, so the
// chart is readable as a shape rather than a set of coordinates, and you adjust
// a period by dragging it rather than by typing a time into a field.
//
// TWO LINES, OVERLAID. Brightness and colour temperature share the plot. The one
// you are editing is drawn in front and is the one that reacts; the other stays
// behind at low opacity, because what you usually want to know while dragging
// one is what the other is doing at the same hour.
//
// THE COLOUR OF A LINE IS ITS VALUE. Both strokes are painted with a vertical
// gradient in user space, so a point's colour depends on its height alone: dim
// blue at the bottom of the brightness line and warm gold at the top; on the
// colour line, literally the light's own colour, candle at the bottom and
// daylight at the top. It means you can read the chart without reading the axis.
const SCHED = { points: [], max: 24, now: 0, tz: '',
                hover: -1, hoverSeries: null, drag: -1, dragSeries: null,
                nowAt: 0, tick: null, pending: null,
                // What the server holds, and which of it is being edited.
                data: null, sel: { house: true } };

/* Twelve columns of two hours, fixed.
 *
 * It was adjustable, stepping through the divisors of 24, and the control cost
 * a corner of the toolbar to answer a question nobody asks twice. Two hours is
 * fine enough to shape an evening and coarse enough that the curve through the
 * column centres stays smooth; below it you are drawing noise, above it you
 * cannot separate dusk from night.
 */
const COLUMNS = 12;

/* The plot has the page to itself, so it is tall.
 *
 * The gap between `bottom` and `axis` is the whole of the time scale, and it is
 * deliberately narrow: the hours are a reference, not a row of headings, so they
 * get a line of small type and a tick each rather than a band of their own. */
const PLOT = { w: 1200, top: 68, bottom: 452, axis: 476, h: 492 };

const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' +
                  String(Math.round(m) % 60).padStart(2, '0');

// Perceptual brightness, and it is not a refinement.
//
// Matter level 1..254 is proportional to the light emitted, and the eye is not:
// at 127 you do not see "half", you see about three quarters. Plotted linearly
// the entire useful evening range is squashed into the bottom sixth of the
// chart. L* from CIE Lab is literally "how bright it looks", so half the height
// really does look half as bright - and that lands at level 47, not 127.
function perceived(level) {
  const y = Math.max(0, Math.min(1, level / 254));
  return (y > 0.008856 ? 116 * Math.cbrt(y) - 16 : 903.3 * y) / 100;
}
function levelFromPerceived(p) {
  const l = Math.max(0, Math.min(1, p)) * 100;
  const y = l > 8 ? Math.pow((l + 16) / 116, 3) : l / 903.3;
  return Math.max(1, Math.min(254, Math.round(y * 254)));
}

/* The recommended day, one entry per column at 12 columns.
 *
 * Modelled on how adaptive lighting behaves rather than copied from it: warm
 * and nearly out overnight, climbing to cold and full through the morning,
 * holding over the middle of the day, then falling back through the afternoon
 * and warming to candle by bedtime. Kelvin in the comments, mireds in the
 * value, because mireds are what the bulb takes and rounding twice would put
 * the curve a degree off what it says.
 *
 * Brightness is PERCEIVED, the same scale the chart and the tiles use, so
 * "60%" here is the 60% you would set by hand - not Matter's level 152. */
const SCHED_RECOMMENDED = [
  // 4% is the floor, not a choice: it is what Matter level 1 comes out at on
  // this scale, and a bulb cannot be dimmer than its lowest step.
  { at: '01:00', pct:   4, mireds: 454 },   // 2200 K
  { at: '03:00', pct:   4, mireds: 454 },   // 2200 K
  { at: '05:00', pct:   4, mireds: 454 },   // 2200 K
  { at: '07:00', pct:  35, mireds: 370 },   // 2700 K
  { at: '09:00', pct:  80, mireds: 250 },   // 4000 K
  { at: '11:00', pct: 100, mireds: 217 },   // 4600 K
  { at: '13:00', pct: 100, mireds: 208 },   // 4800 K
  { at: '15:00', pct:  95, mireds: 222 },   // 4500 K
  { at: '17:00', pct:  80, mireds: 263 },   // 3800 K
  { at: '19:00', pct:  60, mireds: 333 },   // 3000 K
  { at: '21:00', pct:  40, mireds: 370 },   // 2700 K
  { at: '23:00', pct:  15, mireds: 417 },   // 2400 K
];

const MIRED_MIN = 153;   // 6500 K, cold daylight - the top of the colour axis
const MIRED_MAX = 500;   // 2000 K, candle - the bottom
const kelvin = m => Math.round(1e6 / Math.max(1, m) / 50) * 50;

/* What a colour temperature looks like - RELATIVE to a neutral white, which is
 * the only way it can be drawn usefully.
 *
 * The absolute chromaticity of a blackbody is the usual piecewise fit below, and
 * on its own it is useless here: at 6500 K it comes out (255,254,250), which is
 * white, and everything from 2000 K to about 4500 K is orange. Drawn straight,
 * a colour-temperature strip is orange from end to end with a white cap - you
 * cannot aim at it, and it does not match what the light looks like in a room
 * either.
 *
 * The eye does not see absolute chromaticity, it adapts. Sitting under 3500 K
 * you call that white, and 6500 K looks blue. So the blackbody colour is divided
 * by the blackbody colour of a reference and renormalised - von Kries, in the
 * crudest possible form. Below the reference goes orange, above it goes blue,
 * and the strip spans the range the way the room does.
 *
 * 3500 K for the reference: it puts white about three fifths of the way up the
 * strip, which is where the mired scale actually puts neutral. */
const CT_REF_K = 3500;

function blackbody(kelvin) {
  const t = Math.max(1000, Math.min(12000, kelvin)) / 100;
  let r, g, b;
  if (t <= 66) { r = 255; } else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); }
  if (t <= 66) { g = 99.4708025861 * Math.log(t) - 161.1195681661; }
  else { g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); }
  if (t >= 66) { b = 255; }
  else if (t <= 19) { b = 0; }
  else { b = 138.5177312231 * Math.log(t - 10) - 305.0447927307; }
  // The floor matters: at 2000 K the blue channel lands near zero, and dividing
  // by a near-zero reference would blow the adaptation up.
  return [Math.max(1, r), Math.max(1, g), Math.max(1, b)];
}

const CT_REF = blackbody(CT_REF_K);

function ctColor(mireds) {
  const rgb = blackbody(1e6 / Math.max(1, mireds));
  const rel = [rgb[0] / CT_REF[0], rgb[1] / CT_REF[1], rgb[2] / CT_REF[2]];
  const m = Math.max(rel[0], rel[1], rel[2]);
  const c = v => Math.max(0, Math.min(255, Math.round(v / m * 255)));
  return `rgb(${c(rel[0])},${c(rel[1])},${c(rel[2])})`;
}

function ctWord(mireds) {
  const k = 1e6 / Math.max(1, mireds);
  if (k >= 5000) { return 'daylight'; }
  if (k >= 4000) { return 'cool'; }
  if (k >= 3200) { return 'neutral'; }
  if (k >= 2500) { return 'warm'; }
  return 'candle';
}

/* Both series through one pair of functions, so nothing downstream has to know
 * which one it is drawing. norm is 0 at the bottom of the plot and 1 at the top;
 * everything - the curve, the drag, the snapping, the dotted ladder - works in
 * norm and only these two touch the units. */
function normOf(p, series) {
  if (series === 'level') { return perceived(p.level); }
  const m = Math.min(MIRED_MAX, Math.max(MIRED_MIN, p.mireds || 370));
  // High on the chart is cold, low is candle: the way a day runs.
  return 1 - (m - MIRED_MIN) / (MIRED_MAX - MIRED_MIN);
}
function setNorm(p, series, n) {
  const v = Math.max(0, Math.min(1, n));
  if (series === 'level') { p.level = levelFromPerceived(v); }
  else { p.mireds = Math.round(MIRED_MIN + (1 - v) * (MIRED_MAX - MIRED_MIN)); }
}

/* The minute of the day it is now, on the PI's clock.
 *
 * The Pi answers with its own minute when the sheet opens, because the Pi is
 * what runs the schedule and a browser abroad would put the marker hours off.
 * From there the browser's clock only supplies the time elapsed since - the two
 * disagree about what time it is, never about how fast it passes. */
function nowMinute() {
  const since = SCHED.nowAt ? (Date.now() - SCHED.nowAt) / 60000 : 0;
  return (SCHED.now + since) % 1440;
}

const colWidth = () => PLOT.w / SCHED.points.length;
const colCentre = i => (i + 0.5) * colWidth();
const DOT_R = 4;              // dormant handle; the live one is 6
const yOf = n => PLOT.bottom - n * (PLOT.bottom - PLOT.top);
const normFromY = y => (PLOT.bottom - y) / (PLOT.bottom - PLOT.top);

// Which column a minute of the day falls in.
function colAt(minute) {
  const n = SCHED.points.length;
  return Math.max(0, Math.min(n - 1, Math.floor(minute / 1440 * n)));
}

/* The curve, and it is the same curve the Pi follows.
 *
 * A spline through the middle of each column, sampled - not emitted as beziers
 * and then applied as something else. It used to be drawn as beziers while the
 * Pi applied a step function, so dragging the 12:00 column visibly bent the line
 * over 11:40 while the light at 11:40 did not move. Drawing by sampling the very
 * function the server evaluates makes that class of bug impossible rather than
 * merely fixed: server.py has the same twenty lines, in Python.
 *
 * CYCLIC, because a day is a loop. The sample before the first column is the
 * last one, so the light glides through midnight instead of stepping at it. */
/* Monotone cubic - Fritsch-Carlson - and not Catmull-Rom, which is what this
 * used to be.
 *
 * Catmull-Rom takes the tangent at a point from its neighbours, so the first
 * column of a plateau gets a large upward tangent from the ramp before it and
 * the curve sails PAST the plateau before coming back down to it. That bump,
 * and the kink where it lands, are the sharp bits: a flat top drawn as a hump.
 * The same thing inverted puts a dip under a valley floor.
 *
 * Monotone tangents are clamped so the curve can never leave the interval
 * between two neighbouring values. A plateau is arrived at with zero slope and
 * stays flat, a step becomes a clean S, and nothing overshoots a value you never
 * asked for - which on a light schedule is not only ugly but wrong: a bump above
 * a 100% plateau is a brightness the bulb cannot produce.
 *
 * Cyclic throughout, like everything else about the day. */
function monoTangents(y) {
  const n = y.length;
  const at = k => y[((k % n) + n) % n];
  const d = [];
  for (let i = 0; i < n; i++) { d.push(at(i + 1) - at(i)); }
  const m = [];
  for (let i = 0; i < n; i++) { m.push((d[(i - 1 + n) % n] + d[i]) / 2); }

  // A flat segment pins both its ends: this is what keeps plateaus flat.
  for (let i = 0; i < n; i++) {
    if (d[i] === 0) { m[i] = 0; m[(i + 1) % n] = 0; }
  }
  // And the circle condition, which is what keeps the rest inside its interval.
  for (let i = 0; i < n; i++) {
    if (d[i] === 0) { continue; }
    const j = (i + 1) % n;
    const a = m[i] / d[i];
    const b = m[j] / d[i];
    const q = a * a + b * b;
    if (q > 9) {
      const t = 3 / Math.sqrt(q);
      m[i] = t * a * d[i];
      m[j] = t * b * d[i];
    }
  }
  return m;
}

function sampleNorm(vals, minute, tang) {
  const n = vals.length;
  if (n < 2) { return vals[0] || 0; }
  const m = tang || monoTangents(vals);
  const u = minute / (1440 / n) - 0.5;      // 0 at the first column's centre
  const i = Math.floor(u);
  const t = u - i;
  const i0 = ((i % n) + n) % n;
  const i1 = (i0 + 1) % n;
  const t2 = t * t;
  const t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * vals[i0]
       + (t3 - 2 * t2 + t) * m[i0]
       + (-2 * t3 + 3 * t2) * vals[i1]
       + (t3 - t2) * m[i1];
}

/* ---------- the chart ----------
 *
 * TWO CONTROLS, BOTH ALWAYS VISIBLE, AND NO SWITCH BETWEEN THEM.
 *
 *   the filled area  is brightness - its height is the level
 *   the line         is colour temperature - its height is the mireds
 *
 * There used to be a brightness/colour toggle and only one of them was live at
 * a time, which is the wrong shape for the job: setting an evening means
 * setting both, and having to remember which mode you were in is a tax on every
 * single edit. The pointer picks whichever curve it is nearer, so there is
 * nothing to choose in advance and nothing to be in the wrong mode for.
 *
 * The fill is exactly what a lit tile uses on the home page: --lit, flat, with a
 * hairline along its top edge. Same colour and same treatment on purpose - a
 * bulb at 60% on a tile and the schedule asking for 60% at this hour are the
 * same fact, and they should not be two different pictures. It was a vertical
 * gradient of its own for a while, which was prettier in isolation and wrong
 * next to the thing it describes.
 */
const CURVE_STEP = 6;      // minutes between samples of the drawn curve

// How finely each control moves. Brightness in tenths with a floor at 10%,
// because finer is a schedule full of 61% and 63% and below a tenth is a lamp
// that is technically on. Colour is finer - a step there is about 14 mireds,
// roughly where a change stops being visible.
const LADDER = {
  level: { min: 0.1, notches: 10 },
  ct: { min: 0, notches: 25 },
};

function snapNorm(n, series) {
  const l = LADDER[series] || LADDER.ct;
  const q = Math.round(n * (l.notches - 1)) / (l.notches - 1);
  return Math.max(l.min, Math.min(1, l.min + q * (1 - l.min)));
}

function seriesNorms(series) {
  const vals = SCHED.points.map(p => normOf(p, series));
  const tang = monoTangents(vals);
  const out = [];
  for (let m = 0; m <= 1440; m += CURVE_STEP) {
    out.push([m, Math.max(0, Math.min(1, sampleNorm(vals, m, tang)))]);
  }
  return out;
}

function pathOf(samples) {
  return samples.map(([m, v], i) =>
    (i ? 'L ' : 'M ') + (m / 1440 * PLOT.w).toFixed(1) + ' ' + yOf(v).toFixed(1)
  ).join(' ');
}

/* Which control the pointer is on, or nothing.
 *
 * You have to be ON a line. Anywhere else in the plot is not a control, and a
 * handle that follows the pointer across empty chart claims otherwise - it also
 * means there is no way to just look at the schedule without appearing to be
 * about to change it.
 *
 * Within reach, the nearer wins. Nothing else: there used to be a rule that
 * below BOTH curves you were inside the filled area and therefore meant
 * brightness, which was written before the reach limit existed and became a bug
 * the moment it did - the colour line is below the brightness edge for most of
 * a normal day, so hovering just under it satisfied "below both" and the handle
 * jumped to the orange line above. Standing deep inside the fill now selects
 * nothing at all, which is what the limit is for. */
const GRAB = 30;      // svg units - about 7% of the plot's height

function nearestSeries(minute, y) {
  const at = series => {
    const vals = SCHED.points.map(p => normOf(p, series));
    return yOf(Math.max(0, Math.min(1, sampleNorm(vals, minute))));
  };
  const dl = Math.abs(y - at('level'));
  const dc = Math.abs(y - at('ct'));
  if (Math.min(dl, dc) > GRAB) { return null; }
  return dl <= dc ? 'level' : 'ct';
}

function drawChart() {
  const box = $('#chart');
  if (!box) { return; }
  const pts = SCHED.points;
  if (!pts.length) { return; }

  const now = nowMinute();
  const lvl = seriesNorms('level');
  const ct = seriesNorms('ct');
  const area = pathOf(lvl) + ` L ${PLOT.w} ${PLOT.bottom} L 0 ${PLOT.bottom} Z`;

  // Quarters across; down, one rule per column - and a column is exactly what
  // you can take hold of. A rule at every hour looked tidier and was worse to
  // use: twenty-three identical lines, twelve of which meant "grab here" and
  // eleven of which meant nothing, with no way to tell them apart. The grid
  // answers "where are the handles" now, which is the only question anyone
  // asks of it while dragging.
  let grid = '';
  for (const f of [0.25, 0.5, 0.75]) {
    const y = yOf(f).toFixed(1);
    grid += `<line class="grid" x1="0" y1="${y}" x2="${PLOT.w}" y2="${y}"/>`;
  }
  for (let i = 0; i < pts.length; i++) {
    const x = colCentre(i).toFixed(1);
    grid += `<line class="grid" x1="${x}" y1="${PLOT.top}" x2="${x}" y2="${PLOT.bottom}"/>`;
  }

  // Every hour. Small type on a tick, and each one sitting on its own grid line,
  // so a time on the chart is read rather than estimated.
  let axis = '';
  for (let h = 0; h <= 24; h++) {
    const x = h / 24 * PLOT.w;
    const lx = h === 0 ? x + 8 : h === 24 ? x - 8 : x;
    axis += `<line class="tick" x1="${x.toFixed(1)}" y1="${PLOT.bottom}"
                   x2="${x.toFixed(1)}" y2="${PLOT.bottom + 4}"/>`;
    axis += `<text class="axis${h % 3 ? '' : ' keep'}" x="${lx.toFixed(1)}" y="${PLOT.axis}"
                   text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}"
             >${String(h).padStart(2, '0')}</text>`;
  }

  // One open ring per column per curve, and a hole in the curve beneath each.
  // The ring under the pointer is left out: the live handle stands in for it,
  // and two markers on the same spot is one too many.
  const liveCol = SCHED.drag >= 0 ? SCHED.drag : SCHED.hover;
  const liveSeries = SCHED.dragSeries || SCHED.hoverSeries;
  const holes = { level: '', ct: '' };
  let dots = '';
  for (let i = 0; i < pts.length; i++) {
    const cx = colCentre(i).toFixed(1);
    for (const s of ['level', 'ct']) {
      const cy = yOf(normOf(pts[i], s)).toFixed(1);
      // Luminance mask: black hides. Literal colours because only the channel
      // matters here - the same exception the grid mask gets.
      holes[s] += `<circle cx="${cx}" cy="${cy}" r="${DOT_R}" fill="#000"/>`;
      if (i === liveCol && s === liveSeries) { continue; }
      dots += `<circle class="dot ${s}" cx="${cx}" cy="${cy}" r="${DOT_R}"/>`;
    }
  }
  const maskFor = s => `<mask id="m-${s}" maskUnits="userSpaceOnUse"
        x="0" y="0" width="${PLOT.w}" height="${PLOT.h}">
        <rect x="0" y="0" width="${PLOT.w}" height="${PLOT.h}" fill="#fff"/>
        ${holes[s]}</mask>`;

  // What the curve is asking for at this exact minute, beside the time it is
  // asking for it. The chart could always be read off by eye, but reading a
  // spline against a dotted ladder is estimating, and the one value anybody
  // actually wants to check is the one for right now.
  const nowLvl = sampleNorm(SCHED.points.map(p => normOf(p, 'level')), now);
  const nowCtN = sampleNorm(SCHED.points.map(p => normOf(p, 'ct')), now);
  const nowMir = Math.round(MIRED_MIN + (1 - nowCtN) * (MIRED_MAX - MIRED_MIN));
  const nowSay = `(${Math.round(nowLvl * 100)}% \u00b7 ${kelvin(nowMir)} K)`;

  const nx = now / 1440 * PLOT.w;
  const nudge = nx < 120 ? 8 : nx > PLOT.w - 120 ? -8 : 0;
  const anchor = nx < 120 ? 'start' : nx > PLOT.w - 120 ? 'end' : 'middle';
  const nowMark = `
    <line class="nowline" x1="${nx.toFixed(1)}" y1="${PLOT.top - 12}"
          x2="${nx.toFixed(1)}" y2="${PLOT.bottom}"/>
    <text class="nowtext" x="${(nx + nudge).toFixed(1)}" y="${PLOT.top - 38}"
          text-anchor="${anchor}">${hhmm(now)}</text>
    <text class="nowval" x="${(nx + nudge).toFixed(1)}" y="${PLOT.top - 19}"
          text-anchor="${anchor}">${nowSay}</text>`;

  box.innerHTML = `<svg viewBox="0 0 ${PLOT.w} ${PLOT.h}" id="chart-svg">
    <defs>${maskFor('level')}${maskFor('ct')}</defs>
    ${grid}
    <path class="fill" d="${area}"/>
    <path class="edge" mask="url(#m-level)" d="${pathOf(lvl)}"/>
    <path class="ctline" mask="url(#m-ct)" d="${pathOf(ct)}"/>
    ${dots}
    ${nowMark}
    ${axis}
  </svg>`;

  drawHandle();
}

/* The handle: a circle sitting on the curve, with an arrow above and below.
 *
 * Two arrows and a circle is the whole vocabulary - it says "this point, and it
 * moves up and down" without a legend, and it appears only under the pointer so
 * the chart at rest is the two curves and nothing else. */
function drawHandle() {
  const svg = document.querySelector('#chart-svg');
  const i = SCHED.drag >= 0 ? SCHED.drag : SCHED.hover;
  const series = SCHED.dragSeries || SCHED.hoverSeries;
  if (!svg || i < 0 || !SCHED.points[i] || !series) { return; }

  const p = SCHED.points[i];
  const cx = colCentre(i);
  const cy = yOf(normOf(p, series));
  const label = series === 'level'
    ? Math.round(perceived(p.level) * 100) + '%'
    : kelvin(p.mireds || 370) + ' K';
  const side = cx < PLOT.w - 200 ? 1 : -1;
  // Sized against the chart's own type, which is 11 units: the handle was drawn
  // at nearly twice that and read as a control borrowed from a bigger
  // interface. It is a marker on a hairline, not a button.
  const arrow = (dy, up) =>
    `<path class="arw" d="M ${(cx - 4.5).toFixed(1)} ${(cy + dy + (up ? 3.5 : -3.5)).toFixed(1)}
        L ${cx.toFixed(1)} ${(cy + dy).toFixed(1)}
        L ${(cx + 4.5).toFixed(1)} ${(cy + dy + (up ? 3.5 : -3.5)).toFixed(1)}"/>`;

  svg.insertAdjacentHTML('beforeend', `
    <g class="handle${SCHED.drag >= 0 ? ' live' : ''}">
      ${arrow(-18, true)}${arrow(18, false)}
      <circle class="ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6"/>
      <text class="hval" x="${(cx + side * 15).toFixed(1)}" y="${(cy + 4.5).toFixed(1)}"
            text-anchor="${side > 0 ? 'start' : 'end'}">${label}</text>
    </g>`);
}

/* Pointer to column, series and value.
 *
 * Through the svg's own matrix rather than a rule of three on the container's
 * box: the svg is replaced on every move, and measuring an element that is
 * about to be replaced is how a dragged point ends up in the corner. */
function chartAt(ev) {
  const svg = document.querySelector('#chart-svg');
  const ctm = svg && svg.getScreenCTM();
  if (!ctm) { return null; }
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX;
  pt.y = ev.clientY;
  const loc = pt.matrixTransform(ctm.inverse());
  const n = SCHED.points.length;
  const minute = Math.max(0, Math.min(1440, loc.x / PLOT.w * 1440));
  return {
    col: Math.max(0, Math.min(n - 1, Math.floor(loc.x / PLOT.w * n))),
    series: nearestSeries(minute, loc.y),
    norm: Math.max(0, Math.min(1, normFromY(loc.y))),
  };
}

function bindChart() {
  const box = $('#chart');
  if (!box) { return; }

  box.onpointermove = ev => {
    const at = chartAt(ev);
    if (!at) { return; }
    if (SCHED.drag >= 0) {
      setNorm(SCHED.points[SCHED.drag], SCHED.dragSeries,
              snapNorm(at.norm, SCHED.dragSeries));
      drawChart();
      return;
    }
    // Off both lines: no handle, and the cursor says so.
    box.classList.toggle('on-line', !!at.series);
    const col = at.series ? at.col : -1;
    if (col !== SCHED.hover || at.series !== SCHED.hoverSeries) {
      SCHED.hover = col;
      SCHED.hoverSeries = at.series;
      drawChart();
    }
  };

  box.onpointerleave = () => {
    if (SCHED.drag >= 0) { return; }
    box.classList.remove('on-line');
    SCHED.hover = -1;
    SCHED.hoverSeries = null;
    drawChart();
  };

  box.onpointerdown = ev => {
    const at = chartAt(ev);
    if (!at || !at.series) { return; }     // pressing empty chart is not a drag
    ev.preventDefault();
    SCHED.drag = at.col;
    SCHED.dragSeries = at.series;
    SCHED.hover = at.col;
    SCHED.hoverSeries = at.series;
    box.setPointerCapture(ev.pointerId);
    // The value does not jump on the press itself - the first move is what
    // moves it. Pressing to read a column must not change it.
    drawChart();
  };

  const release = ev => {
    if (SCHED.drag < 0) { return; }
    SCHED.drag = -1;
    SCHED.dragSeries = null;
    if (box.hasPointerCapture && box.hasPointerCapture(ev.pointerId)) {
      box.releasePointerCapture(ev.pointerId);
    }
    drawChart();
  };
  box.onpointerup = release;
  box.onpointercancel = release;
}

function note(msg) {
  const el = $('#sched-msg');
  if (el) { el.textContent = msg || ''; }
}

/* What the save actually did, in a sentence you can act on.
 *
 * "written into 1 bulb" was true and read as a lie: a bulb that is off takes
 * every write and shows nothing, because MoveToLevel is ignored while off - on
 * purpose, so a schedule can never light a dark room at four in the morning.
 * Standing in front of an unchanged lamp, "written into 1 bulb" is exactly the
 * wrong thing to be told. */
function saveOutcome(j) {
  const pct = typeof j.level === 'number'
