    ? Math.round(perceived(j.level) * 100) + '%' : '';
  const bulbs = n => `${n} bulb${n === 1 ? '' : 's'}`;
  const bits = [];
  if (j.lit) { bits.push(`${bulbs(j.lit)} now at ${pct}`); }
  if (j.dark) {
    bits.push(`${bulbs(j.dark)} off — ${j.dark === 1 ? 'it' : 'they'} will come up at ${pct}`);
  }
  if (j.unknown) { bits.push(`${bulbs(j.unknown)} did not answer`); }
  if (j.held) { bits.push(`${bulbs(j.held)} released from being held by hand`); }
  if (!bits.length) { return 'saved · no bulb is bound to a switch, so nothing to write'; }
  return 'saved · ' + bits.join(' · ');
}

/* Whatever is in the file, expressed as twelve equal columns.
 *
 * A schedule may have been written with any number of points at any times - by
 * the older editor, or by hand - so the first thing that happens is a resample:
 * each column takes the value that was in effect at its own midpoint. The shape
 * of the day survives, which is the part somebody actually chose. */
function columnsFrom(points) {
  const n = COLUMNS;
  const at = minute => {
    let slot = points[points.length - 1];
    for (const p of points) {
      if ((p.min || 0) <= minute) { slot = p; } else { break; }
    }
    return slot || { level: 128, mireds: 370, fade: 20 };
  };
  return Array.from({ length: n }, (_, i) => {
    const src = at(Math.round((i + 0.5) * 1440 / n));
    const p = { min: Math.round(i * 1440 / n), level: src.level,
                mireds: src.mireds || 370, fade: src.fade ?? 20 };
    // Onto the ladder on the way in: a column between two notches is one you
    // cannot put back where you found it, and a floor that spares what is
    // already there is not a floor.
    setNorm(p, 'level', snapNorm(perceived(p.level), 'level'));
    setNorm(p, 'ct', snapNorm(normOf(p, 'ct'), 'ct'));
    return p;
  });
}

/* ---------- the schedule is a page, not a dialog ----------
 *
 * A whole day, two curves and a list of bulbs does not fit in a box in the
 * middle of the screen, and every pixel spent on the backdrop is a pixel the
 * chart does not get. It takes over the view instead: same page, same toolbar,
 * a back control where the room sections would be. */

async function refreshScope() {
  try {
    const d = await (await api('/api/schedule')).json();
    if (!d.error) { SCHED.data = d; paintScope(); }
  } catch (err) { /* the list keeps its last honest state */ }
}

function schedGoverned() { return (SCHED.data && SCHED.data.governed) || []; }

function pointsForSel() {
  const data = SCHED.data;
  if (!data) { return { points: [], mixed: false }; }
  if (SCHED.sel.house) { return { points: data.points, mixed: false }; }
  const sets = SCHED.sel.nodes.map(n => data.bulbs[String(n)] || data.points);
  const first = JSON.stringify(sets[0] || data.points);
  return { points: sets[0] || data.points,
           mixed: sets.some(x => JSON.stringify(x) !== first) };
}

/* Two different things, and conflating them cost an edit.
 *
 * retarget() changes who a save is FOR. selectScope() changes that AND throws
 * away the curve on screen to load theirs. Save-globally wants the first: the
 * curve you just drew, given to the house. It called the second, which quietly
 * reloaded the saved curve a moment before posting it - so the save worked
 * perfectly and stored what was already there, and the edit vanished in the
 * one frame between the click and the request. */

/* Load the recommended day into the editor - and only into the editor.
 *
 * It does not save. Resetting straight into the house would mean the one
 * button on this page that cannot be looked at before it takes effect, and the
 * curve is the whole point of looking. */
function resetToRecommended() {
  SCHED.points = SCHED_RECOMMENDED.map((r, i) => ({
    min: Math.round(i * 1440 / SCHED_RECOMMENDED.length),
    level: levelFromPerceived(r.pct / 100),
    mireds: r.mireds,
    fade: 20,
  }));
  SCHED.hover = -1;
  SCHED.drag = -1;
  drawChart();
  note('recommended day loaded — nothing is saved until you press save');
}

function retarget(scope) {
  SCHED.sel = scope;
  paintScope();
}

function selectScope(scope) {
  retarget(scope);
  const r = pointsForSel();
  SCHED.points = columnsFrom(JSON.parse(JSON.stringify(r.points)));
  SCHED.hover = -1;
  SCHED.drag = -1;
  drawChart();
  note(r.mixed
    ? 'these bulbs do not have the same schedule — saving gives them all this one'
    : '');
}

/* What the two save buttons say, and what the line above the chart says.
 *
 * The scope used to be a list sitting under the chart, always open whether you
 * were changing it or not - a table of every bulb in the house taking permanent
 * room on a page whose job is a curve. It is a picker now, behind the second
 * button, and the button itself carries the answer: you can see what a save
 * will hit without opening anything.
 */
function paintScope() {
  const say = $('#scope-say');
  if (!say) { return; }
  const gov = schedGoverned();
  const followers = gov.filter(g => !g.own).length;
  const picked = SCHED.sel.house ? [] : SCHED.sel.nodes;
  const owned = picked.filter(n => (SCHED.data.bulbs || {})[String(n)]);
  const names = picked.map(n => (gov.find(g => g.node === n) || {}).name || n);

  say.textContent = SCHED.sel.house
    ? `editing the house schedule — ${followers} bulb${followers === 1 ? '' : 's'} follow${followers === 1 ? 's' : ''} it`
    : picked.length === 1
      ? `editing ${names[0]} on its own`
      : `editing ${picked.length} bulbs together`;

  // The second button is pre-filled when you arrived from a bulb, so the common
  // case - open a lamp's schedule, change it, save it - is one press with the
  // target already named on the button.
  const split = $('#save-some');
  const lbl = split.querySelector('.lbl');
  lbl.textContent = !picked.length ? 'save for…'
    : picked.length === 1 ? `save for ${names[0]}`
    : `save for ${picked.length} bulbs`;
  split.classList.toggle('armed', picked.length > 0);

  $('#save-sched').classList.toggle('dim', picked.length > 0);

  const back = $('#sched-follow');
  back.style.display = owned.length ? '' : 'none';
  back.textContent = owned.length === 1
    ? 'put it back on the house schedule'
    : `put ${owned.length} bulbs back on the house schedule`;
}

/* Which bulbs get this schedule.
 *
 * Grouped by room, because that is how anybody holds a house in their head -
 * "the bedside lamps", not "nodes 1004 and 1005". A bulb that already has a
 * schedule of its own is marked, so you can see what you are about to overwrite
 * before you tick it. */
function openTargetPicker() {
  const sheet = $('#sheet');
  const gov = schedGoverned();
  const picked = new Set(SCHED.sel.house ? [] : SCHED.sel.nodes);

  const byRoom = {};
  gov.forEach(g => (byRoom[g.where || ''] ||= []).push(g));
  const rooms = Object.keys(byRoom).sort((a, b) => a.localeCompare(b));

  sheet.innerHTML = `<h2>save this schedule for</h2>
    <div class="who"></div>
    <div class="pick" id="tpick"></div>
    <button class="go" id="tsave"></button>
    <div class="note" id="tnote"></div>`;

  sheet.querySelector('.who').textContent =
    gov.length ? 'tick the bulbs this curve should govern' : '';

  const list = sheet.querySelector('#tpick');
  if (!gov.length) {
    list.innerHTML = '<div class="empty" style="padding:14px">no bulbs yet</div>';
  }
  rooms.forEach(room => {
    const head = document.createElement('div');
    head.className = 'group';
    head.textContent = room || 'no room';
    list.append(head);
    byRoom[room].forEach(g => {
      const row = document.createElement('label');
      row.innerHTML = `<input type="checkbox"${picked.has(g.node) ? ' checked' : ''}>
        <span class="nm"></span>
        <span class="nid">${g.own ? 'has its own' : 'house'}</span>`;
      row.querySelector('.nm').textContent = g.name;
      if (g.own) { row.querySelector('.nid').classList.add('own'); }
      row.querySelector('input').onchange = ev => {
        if (ev.target.checked) { picked.add(g.node); } else { picked.delete(g.node); }
        paintCount();
      };
      list.append(row);
    });
  });

  const btn = sheet.querySelector('#tsave');
  const paintCount = () => {
    btn.disabled = picked.size === 0;
    btn.textContent = picked.size === 0 ? 'pick at least one bulb'
      : picked.size === 1 ? 'save for this bulb'
      : `save for these ${picked.size} bulbs`;
  };
  paintCount();

  btn.onclick = async () => {
    const nodes = [...picked];
    if (!nodes.length) { return; }
    closeSheet();
    selectScope({ nodes });
    await saveSchedule();
  };

  $('#overlay').classList.add('on');
}
/* One save, whatever pressed it.
 *
 * The scope always travels with the points. The one thing this editor must
 * never do is change something other than what the line above the chart says it
 * is changing, and that is only guaranteed if there is a single place where the
 * two are put in the same request. */
async function saveSchedule() {
  const btns = [$('#save-sched'), $('#save-some .lbl')].filter(Boolean);
  btns.forEach(b => { b.disabled = true; });
  const lbl = $('#save-some .lbl');
  const before = lbl ? lbl.textContent : '';
  note('saving…');
  let j;
  try {
    j = await (await api('/api/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(SCHED.sel.house
        ? { all: true, points: SCHED.points }
        : { nodes: SCHED.sel.nodes, points: SCHED.points })
    })).json();
  } catch (err) { j = { error: String(err) }; }
  btns.forEach(b => { b.disabled = false; });
  if (lbl) { lbl.textContent = before; }
  if (j.error) { return note('not saved: ' + j.error); }
  await refreshScope();
  note(saveOutcome(j));
  loadBulbs(true);
}

function closeSchedule() {
  clearInterval(SCHED.tick);
  state.view = 'home';
  DOM.sched = null;
  render();
}

/* The way back, from wherever you are.
 *
 * Deliberately not a no-op when you are already home: pressed from the rooms
 * view it still closes an open sheet and takes you to the top, which is what
 * "home" means to somebody halfway down a long house. */
function goHome() {
  closeSheet();
  if (state.view !== 'home') { closeSchedule(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function editSchedule(scope) {
  closeSheet();
  state.view = 'schedule';
  SCHED.pending = scope;
  render();

  let data;
  try {
    data = await (await api('/api/schedule')).json();
  } catch (err) { data = { error: String(err) }; }
  if (state.view !== 'schedule') { return; }   // left again while it loaded

  const body = $('#sched-body');
  if (!body) { return; }
  if (data.error) {
    body.innerHTML = `<div class="failed">${data.error}</div>`;
    return;
  }

  SCHED.max = data.maxPoints || 24;
  SCHED.data = data;
  SCHED.now = typeof data.now === 'number' ? data.now : 0;
  SCHED.nowAt = Date.now();
  SCHED.tz = data.tz || '';

  body.innerHTML = `
    <div class="sched-top">
      <div class="scope-say" id="scope-say"></div>
      <button type="button" class="sched-reset" id="reset-sched"
              title="load the recommended day into the editor">reset</button>
      <button class="sched-save" id="save-sched">save globally</button>
      <div class="split" id="save-some">
        <button type="button" class="lbl"></button>
        <button type="button" class="caret" title="choose which bulbs"
                aria-label="choose which bulbs">&#9662;</button>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="sched-foot">
      <div class="note" id="sched-msg"></div>
      <button class="sched-revert" id="sched-follow" style="display:none"></button>
    </div>`;

  $('#reset-sched').onclick = resetToRecommended;
  $('#save-sched').onclick = () => { retarget({ house: true }); saveSchedule(); };
  $('#save-some .lbl').onclick = () =>
    (SCHED.sel.house ? openTargetPicker() : saveSchedule());
  $('#save-some .caret').onclick = openTargetPicker;

  $('#sched-follow').onclick = async ev => {
    const btn = ev.target;
    const nodes = (SCHED.sel.nodes || [])
      .filter(n => (SCHED.data.bulbs || {})[String(n)]);
    if (!nodes.length) { return; }
    btn.disabled = true;
    let j;
    try {
      j = await (await api('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodes, follow: true })
      })).json();
    } catch (err) { j = { error: String(err) }; }
    btn.disabled = false;
    if (j.error) { return note('not changed: ' + j.error); }
    await refreshScope();
    selectScope(SCHED.sel);
    note(saveOutcome(j));
    loadBulbs(true);
  };

  const want = SCHED.pending;
  SCHED.pending = null;
  selectScope(want && want.nodes && want.nodes.length ? want : { house: true });
  bindChart();

  // The page stays open for minutes at a time. A now-marker frozen where it was
  // when you opened it would be worse than none: you would trust it.
  clearInterval(SCHED.tick);
  SCHED.tick = setInterval(() => {
    if (!$('#chart')) { clearInterval(SCHED.tick); return; }
    if (SCHED.drag < 0) { drawChart(); }
  }, 30000);
}

function buildScheduleView() {
  const sec = document.createElement('section');
  sec.className = 'sched-view';
  sec.innerHTML = `
    <div class="section-label">
      <button type="button" class="back">&lsaquo; rooms</button>
      <span>light schedule</span>
      <span class="rule"></span>
      <span class="tzn"></span>
    </div>
    <div id="sched-body"><div class="empty">reading…</div></div>`;
  sec.querySelector('.back').onclick = closeSchedule;
  return sec;
}

// ---------- rooms ----------
//
// A room exists only in devices.json. Matter has no concept of one - it is our
// grouping, and it is the only reason that file sits next to the fabric.
//
// This sheet does the two things a drag cannot: name it, and get rid of it.
// Which devices are in it is answered by dragging them there, where the answer
// is also the question - you can see the room you are dropping into.
function editRoom(name) {
  const sheet = $('#sheet');
  const all = [...state.switches, ...(state.devices.bulbs || [])];
  const members = all.filter(d => (d.where || '') === name).length;

  sheet.innerHTML = `
    <h2>${name ? 'room' : 'new room'}</h2>
    <div class="who"></div>
    <label>name</label>
    <input id="r-name" placeholder="Kitchen" autocomplete="off">
    <button class="go">${name ? 'save' : 'create'}</button>
    ${name ? '<button class="danger" id="r-del">delete room</button>' : ''}
    <div class="note" id="r-msg"></div>`;

  const input = sheet.querySelector('#r-name');
  input.value = name || '';
  sheet.querySelector('.who').textContent = name
    ? `${members} device${members === 1 ? '' : 's'} in it`
    : 'drag devices into it afterwards';

  const msg = t => { sheet.querySelector('#r-msg').textContent = t || ''; };

  const save = async btn => {
    const want = input.value.trim();
    if (!want) { input.focus(); return msg('the room needs a name'); }
    if (name && want === name) { return closeSheet(); }
    btn.disabled = true;
    const before = btn.textContent;
    btn.textContent = 'saving…';
    const j = name ? await room({ op: 'rename', name, to: want })
                   : await room({ op: 'add', name: want });
    btn.disabled = false;
    btn.textContent = before;
    if (j.error) { return msg(j.error); }
    closeSheet();
    if (j.devices) { adoptDevices(j.devices); render(); } else { await load(); }
  };
  sheet.querySelector('.go').onclick = e => save(e.target);
  input.onkeydown = e => { if (e.key === 'Enter') { save(sheet.querySelector('.go')); } };

  const del = sheet.querySelector('#r-del');
  if (del) {
    // Two presses. Deleting a room does not delete what is in it - the devices
    // simply end up with no room - but you have no way of knowing that before
    // you press, so it should not happen by accident either.
    del.onclick = async () => {
      if (!del.classList.contains('armed')) {
        del.classList.add('armed');
        del.textContent = members ? `press again — ${members} device(s) lose their room`
                                  : 'press again to delete';
        setTimeout(() => {
          del.classList.remove('armed');
          del.textContent = 'delete room';
        }, 4000);
        return;
      }
      del.disabled = true;
      const j = await room({ op: 'remove', name });
      if (j.error) { del.disabled = false; return msg(j.error); }
      closeSheet();
      if (j.devices) { adoptDevices(j.devices); render(); } else { await load(); }
    };
  }

  $('#overlay').classList.add('on');
  input.focus();
  input.select();
}

async function room(payload) {
  try {
    return await (await api('/api/room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })).json();
  } catch (err) { return { error: String(err) }; }
}

/* ---------- dragging a device into another room ----------
 *
 * Written on pointer events rather than the HTML drag-and-drop API, which does
 * not exist on touch at all - and a panel on a wall tablet is the case where
 * this matters most.
 *
 * It starts on a LONG PRESS, not on movement, and the same way for mouse and
 * finger. Starting on movement would mean every attempt to scroll the page with
 * a finger picks up whatever tile it started on. The press has to hold still:
 * move more than SLOP before the timer fires and it is a scroll, and we let it
 * go.
 *
 * The tile itself is what moves - no clone. A copy would have to reproduce the
 * fill, the badge and the icon state, and would drift from them the moment any
 * of that changed. Transformed in place, its slot in the grid stays behind,
 * which is also a useful thing to see: where it came from. */
const DRAG = { el: null, node: null, from: null, id: null, x: 0, y: 0,
               px: 0, py: 0, timer: null, scroll: null, live: false,
               target: null, moved: false, dirty: false, ph: null, rect: null };
const DRAG_HOLD_MS = 350;
const DRAG_SLOP = 10;
const DRAG_EDGE = 90;      // px from the viewport edge where the page scrolls
const DRAG_SPEED = 14;     // px per tick at the very edge

function armDrag(el) {
  el.addEventListener('pointerdown', ev => {
    // The quick action is a button of its own; holding it must not drag.
    if (ev.target.closest('.quick')) { return; }
    if (ev.button !== undefined && ev.button !== 0) { return; }

    DRAG.el = el;
    DRAG.node = Number(el.dataset.node);
    DRAG.from = el.closest('.room') ? el.closest('.room').dataset.room : '';
    DRAG.id = ev.pointerId;
    DRAG.x = DRAG.px = ev.clientX;
    DRAG.y = DRAG.py = ev.clientY;
    DRAG.live = false;
    DRAG.moved = false;
    clearTimeout(DRAG.timer);
    DRAG.timer = setTimeout(() => startDrag(ev), DRAG_HOLD_MS);
  });
}

function startDrag(ev) {
  const el = DRAG.el;
  if (!el) { return; }
  DRAG.live = true;

  /* Out of the grid's flow, pinned exactly where it already was.
   *
   * position:fixed rather than a transform on an element still in the layout,
   * because the grid has to reflow around the gap so you can see where the
   * tile will land. Fixed is also what makes the auto-scroll simple: the
   * element is placed in viewport coordinates and so is the pointer, so it
   * tracks the finger whatever the page does underneath. */
  const r = el.getBoundingClientRect();
  DRAG.rect = r;

  // The gap. It is a real element in the grid, moved to wherever the drop
  // would land - so the preview is the layout itself, not a line drawn on top
  // of it that the layout might disagree with.
  const ph = document.createElement('div');
  ph.className = 'tile ghost';
  ph.style.height = r.height + 'px';
  el.parentNode.insertBefore(ph, el);
  DRAG.ph = ph;

  el.style.position = 'fixed';
  el.style.left = r.left + 'px';
  el.style.top = r.top + 'px';
  el.style.width = r.width + 'px';
  el.style.height = r.height + 'px';
  el.style.margin = '0';
  el.classList.add('dragging');
  document.body.classList.add('dnd');
  el.setPointerCapture(DRAG.id);

  // Anything the press managed to select before the hold completed. The CSS
  // stops a selection starting on a tile; this clears one that began just
  // outside it and was dragged across.
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) { sel.removeAllRanges(); }
  // A short buzz on touch: the gesture has no other way of telling you it took.
  if (navigator.vibrate) { navigator.vibrate(12); }
  // Hold near an edge and the page scrolls. Without it you can only drop into a
  // room that happens to be on screen already, and elementFromPoint returns
  // nothing outside the viewport - so the drop would silently do nothing.
  clearInterval(DRAG.scroll);
  DRAG.scroll = setInterval(dragScrollTick, 16);
  aimAt(DRAG.px, DRAG.py);
}

function dragScrollTick() {
  if (!DRAG.live) { return; }
  const top = DRAG.py - DRAG_EDGE;
  const bottom = DRAG.py - (window.innerHeight - DRAG_EDGE);
  let dy = 0;
  if (top < 0) { dy = (top / DRAG_EDGE) * DRAG_SPEED; }
  else if (bottom > 0) { dy = (bottom / DRAG_EDGE) * DRAG_SPEED; }
  if (!dy) { return; }
  window.scrollBy(0, dy);
  // The tile is in viewport coordinates and so is the finger, so neither needs
  // correcting for the scroll. What the page moved is everything else - so the
  // drop position has to be worked out again.
  aimAt(DRAG.px, DRAG.py);
}

/* Where in a grid the tile would land: the index of the first tile the pointer
 * is before.
 *
 * "Before" in a grid is two questions, not one - above this row, or inside it
 * and left of this tile's middle. Comparing distance to centres instead, the
 * usual shortcut, puts the gap in the wrong row whenever the rows are taller
 * than they are wide. */
function insertionIndex(grid, x, y) {
  const kids = [...grid.children].filter(
    c => c.classList.contains('tile') && c !== DRAG.ph && c !== DRAG.el);
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (y < r.top) { return i; }
    if (y <= r.bottom && x < r.left + r.width / 2) { return i; }
  }
  return kids.length;
}

/* Which room, and which slot in it. Called on every move and on every scroll
 * tick, so it does nothing when the answer has not changed - moving the gap
 * reflows a grid, and doing that sixty times a second for no reason is visible.
 *
 * The dragged tile is pointer-events:none, so this sees what is underneath it
 * rather than the tile itself. */
function aimAt(x, y) {
  const under = document.elementFromPoint(x, y);
  const sec = under && under.closest('.room');
  // Off every room - between two of them, or past the end of the page. Keep the
  // last answer rather than dropping the gap; the pointer is on its way
  // somewhere and a gap that vanishes and comes back flickers.
  if (!sec || !sec._parts) { return; }

  if (DRAG.target !== sec.dataset.room) {
    document.querySelectorAll('.room.over').forEach(r => r.classList.remove('over'));
    sec.classList.add('over');
    DRAG.target = sec.dataset.room;
  }

  const grid = sec._parts.grid;
  const idx = insertionIndex(grid, x, y);
  const kids = [...grid.children].filter(
    c => c.classList.contains('tile') && c !== DRAG.ph && c !== DRAG.el);
  const ref = kids[idx] || null;
  if (DRAG.ph.parentNode !== grid || DRAG.ph.nextSibling !== ref) {
    grid.insertBefore(DRAG.ph, ref);
  }
}

function endDrag(commit) {
  clearTimeout(DRAG.timer);
  clearInterval(DRAG.scroll);
  const el = DRAG.el;
  if (el && DRAG.live) {
    // Back into the flow, at the gap.
    el.classList.remove('dragging');
    ['position', 'left', 'top', 'width', 'height', 'margin', 'transform']
      .forEach(k => { el.style[k] = ''; });
    if (DRAG.ph && DRAG.ph.parentNode) {
      if (commit) { DRAG.ph.parentNode.insertBefore(el, DRAG.ph); }
      DRAG.ph.remove();
    }
    DRAG.ph = null;
    document.body.classList.remove('dnd');
    document.querySelectorAll('.room.over').forEach(r => r.classList.remove('over'));
    if (commit) { commitDrop(el); }
  }
  const was = DRAG.live;
  DRAG.el = null;
  DRAG.live = false;
  DRAG.target = null;
  DRAG.ph = null;
  // Whatever the poll wanted to redraw while the finger was down.
  if (DRAG.dirty) { DRAG.dirty = false; render(); }
  return was;
}

/* The drop, read back off the screen.
 *
 * The order is taken from the DOM rather than computed from where we think the
 * tile went, because the DOM is what the user just watched settle. Anything
 * else would be a second opinion about the same event. */
function commitDrop(el) {
  const sec = el.closest('.room');
  if (!sec) { return; }
  const to = sec.dataset.room;
  const nodes = [...sec._parts.grid.children]
    .filter(c => c.classList.contains('tile') && !c.classList.contains('ghost'))
    .map(c => Number(c.dataset.node));

  // Dropped back where it started, in the same place. Nothing to write.
  const before = roomMembers(to).map(m => m.d.node);
  if (to === DRAG.from && before.length === nodes.length &&
      before.every((n, i) => n === nodes[i])) { return; }

  saveOrder(to, nodes);
}

async function saveOrder(to, nodes) {
  // The model is updated first, so the redraw that follows agrees with what is
  // already on screen. Waiting for the round trip means the tile snaps back to
  // where it came from for a moment, which reads as "the drop did not take" -
  // and then jumps again when the answer arrives.
  const all = [...state.switches, ...(state.devices.bulbs || [])];
  const undo = all.map(d => ({ d, where: d.where, pos: d.pos }));
  nodes.forEach((n, i) => {
    const d = all.find(x => x.node === n);
    if (d) { d.where = to; d.pos = i; }
  });
  render();

  const j = await room({ op: 'order', name: to, nodes });
  if (j.error) {
    undo.forEach(u => { u.d.where = u.where; u.d.pos = u.pos; });
    render();
    return setStatus(j.error, 'err');
  }
  // The server's copy wins, and it is already in the reply - no reason to go
  // and ask for it again.
  if (j.devices) { adoptDevices(j.devices); render(); }
}

document.addEventListener('pointermove', ev => {
  if (!DRAG.el || ev.pointerId !== DRAG.id) { return; }
  const dx = ev.clientX - DRAG.x;
  const dy = ev.clientY - DRAG.y;

  if (!DRAG.live) {
    // Still waiting out the hold: any real movement means this was a scroll or
    // a slip, not a grab.
    if (Math.hypot(dx, dy) > DRAG_SLOP) { clearTimeout(DRAG.timer); DRAG.el = null; }
    return;
  }

  DRAG.moved = true;
  DRAG.px = ev.clientX;
  DRAG.py = ev.clientY;
  DRAG.el.style.transform = `translate(${dx}px, ${dy}px) scale(1.04)`;
  aimAt(ev.clientX, ev.clientY);
}, { passive: true });

document.addEventListener('pointerup', ev => {
  if (!DRAG.el || ev.pointerId !== DRAG.id) { return; }
  const dragged = endDrag(true);
  // Suppress the click that a pointerup produces, or letting go would also open
  // the settings sheet for the tile you just moved.
  if (dragged) {
    const stop = e => { e.stopPropagation(); e.preventDefault(); };
    document.addEventListener('click', stop, { capture: true, once: true });
    setTimeout(() => document.removeEventListener('click', stop, true), 0);
  }
});
document.addEventListener('pointercancel', () => endDrag(false));

// ---------- edit a switch's bindings ----------
function editLinks(swNode) {
  const sw = state.switches.find(s => s.node === swNode);
  const bound = new Set((state.bySwitch[String(swNode)] || []).map(e => e.node));
  const lk = state.locks[String(swNode)] || {};
  const isLock = lk.role === 1 || sw.role === 'lock';

  // A lock does not control bulbs, it controls switches. Same editor, different
  // list - and it leaves itself out, so it cannot lock itself.
  const items = isLock
    ? state.switches.filter(x => x.node !== swNode)
    : (state.devices.bulbs || []);
  const sheet = $('#sheet');

  sheet.innerHTML = `<h2>bindings</h2>
    <div class="who">${sw.name} &middot; node ${sw.node}</div>
    <div class="hdr rolehdr">what this switch is</div>
    <div class="series" id="rolepick">
      <button data-role="0" class="${isLock ? '' : 'on'}">controls bulbs</button>
      <button data-role="1" class="${isLock ? 'on' : ''}">lock</button>
    </div>
    <div class="pick">${renderPick(items, bound, sw.where,
        isLock ? 'no other switch to lock' : 'no bulbs')}</div>
    <button class="go">save</button>
    <div class="note">${isLock ? `
      Check the switches this lock locks. When pressed, it sends all of them its
      own state &mdash; not a separate toggle for each, so they cannot drift
      apart if one misses the command.<br><br>
      The lock is not in the list: if it could lock itself, you would have no way
      left to unlock the rest from the wall.` : `
      Check every bulb the switch should control. For a lamp with several bulbs,
      check them all &mdash; they come on together, with a single command.<br><br>
      A bulb can be controlled by several switches.`}
    </div>`;
  $('#overlay').classList.add('on');

  sheet.querySelectorAll('#rolepick button').forEach(b => b.onclick = async () => {
    const role = Number(b.dataset.role);
    if ((role === 1) === isLock) { return; }
    // This is not a tab. It rewrites the switch's role ON THE DEVICE, and a
    // switch is a sleepy end device - it answers when it next wakes, which is
    // seconds away. Styled like the segmented control above it and given no
    // busy state, the only thing it did for those seconds was look frozen.
    const seg = sheet.querySelector('#rolepick');
    seg.querySelectorAll('button').forEach(x => x.disabled = true);
    // The spinner goes on the button that was pressed, and counts, because this
    // wait is the switch waking up rather than anything we can hurry.
    const label = b.textContent.trim();
    b.classList.add('waiting');
    b.innerHTML = `${label}<span class="secs"></span>`;
    const secs = b.querySelector('.secs');
    const began = Date.now();
    const ticker = setInterval(() => {
      secs.textContent = Math.round((Date.now() - began) / 1000) + 's';
    }, 250);
    setStatus('changing what this switch is \u2014 it sleeps between presses, '
              + 'so it can take up to 15 seconds to answer', 'warn');
    let j;
    try {
      j = await (await api('/api/role', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ switch: swNode, role })
      })).json();
    } catch (err) { j = { error: String(err) }; }
    clearInterval(ticker);
    b.classList.remove('waiting');
    b.textContent = label;
    seg.querySelectorAll('button').forEach(x => x.disabled = false);
    if (j.error) { return setStatus('the role did not change: ' + j.error, 'err'); }
    setStatus(role === 1 ? 'it is a lock now' : 'it controls bulbs now', 'ok');
    // The role changes both what the switch controls and what the editor lists,
    // so we reload everything instead of patching the screen.
    await load();
    editLinks(swNode);
  });

  sheet.querySelector('.go').onclick = async (e) => {
    const btn = e.target;
    const want = [...sheet.querySelectorAll('.pick input:checked')]
      .map(i => Number(i.value));
    btn.disabled = true;
    btn.textContent = 'writing...';

    let j;
    try {
      j = await (await api('/api/bindings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ switch: swNode, bulbs: want })
      })).json();
    } catch (err) { j = { error: String(err) }; }

    if (j.error || j.errors) {
      sheet.innerHTML = `<h2>bindings</h2>
        <div class="failed">${j.error || j.errors.join('<br>')}</div>`;
      sheetOnClose = load;
      return;
    }
    closeSheet();
    load();
  };
}

async function submitCommission(btn, sheet, kind) {
  const codeEl = $('#f-code');
  const body = {
    kind,
    name: $('#f-name').value.trim(),
    where: $('#f-where').value.trim(),
    code: codeEl ? codeEl.value.trim() : ''
  };
  if (!body.name) { alert('the name is required'); return; }
  if (kind !== 'switch' && !body.code) { alert('the pairing code is required'); return; }
  // "bulb" is no longer something anybody asks for - the server works it out.
  if (kind === 'bulb') { body.kind = 'device'; }

  btn.disabled = true;
  btn.textContent = 'commissioning...';

  let j;
  try {
    j = await (await api('/api/commission', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })).json();
  } catch (err) { j = { error: String(err) }; }

  if (j.error) {
    const title = { switch: 'add switch', bulb: 'add bulb' }[kind] || 'add a device';
    sheet.innerHTML = `<h2>${title}</h2>
      <div class="failed">${j.error}</div>`;
    return;
  }

  const warn = [j.acl_error, j.bind_error].filter(Boolean).join('<br>');
  // What it turned out to be, which nobody had to declare in advance - and, for
  // anything that can be driven by a switch, the fact that nothing drives it
  // yet. It used to say it had been "bound to the switch", which was true and
  // was the bug: it bound itself to whichever switch was listed first, in any
  // room, without being asked.
  const article = w => (/^[aeiou]/i.test(String(w).trim()) ? 'an' : 'a');
  const kindWord = j.kind || (j.unbound ? 'light' : 'device');
  const next = kind === 'switch'
    ? 'The switch is in the fabric. Pick which bulbs it controls from <b>bindings</b>.'
    : j.unbound
      ? `It says it is ${article(kindWord)} <b>${kindWord}</b>. Nothing controls it yet — `
        + (j.switches
            ? 'pick a switch for it from <b>bindings</b>.'
            : 'add a switch first, then wire the two together from <b>bindings</b>.')
      : `It is in the fabric, and it says it is ${article(kindWord)} <b>${kindWord}</b>.`;
  sheet.innerHTML = `<h2>done</h2>
    <div class="who">${j.name} &middot; node ${j.node}</div>
    ${warn ? `<div class="failed">Commissioned, but:<br>${warn}</div>` : ''}
    <div class="note">${next}<br><br>Make a backup:<br>
      <code>./scripts/commission.sh backup</code></div>`;
  sheetOnClose = load;
}

// Room combobox: searches among the existing ones and explicitly offers to
// create a new one. Without it you end up with "bedroom" and "Bedroom" as two
// separate rooms.
function setupRoomCombo() {
  const input = $('#f-where'), list = $('#f-where-list');
  const rooms = (state.devices && state.devices.rooms) || [];
  let idx = -1;

  const norm = s => s.trim().toLowerCase();

  function draw() {
    const q = norm(input.value);
    const hits = rooms.filter(r => norm(r).includes(q));
    const exact = rooms.some(r => norm(r) === q);
    list.innerHTML = '';

    if (q && !exact) {
      const el = document.createElement('div');
      el.className = 'new';
      el.innerHTML = `+ new room: <b>${input.value.trim()}</b>`;
      el.onmousedown = e => { e.preventDefault(); close(); };
      list.append(el);
    }
    hits.forEach(r => {
      const el = document.createElement('div');
      el.textContent = r;
      el.onmousedown = e => { e.preventDefault(); input.value = r; close(); };
      list.append(el);
    });
    if (!list.children.length) {
      const el = document.createElement('div');
      el.className = 'none';
      el.textContent = 'no rooms yet';
      list.append(el);
    }
    idx = -1;
    list.classList.add('on');
  }

  function close() { list.classList.remove('on'); }

  input.onfocus = draw;
  input.oninput = draw;
  input.onblur = () => setTimeout(close, 120);
  input.onkeydown = e => {
    const items = [...list.querySelectorAll('div:not(.none)')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('sel', i === idx));
      items[idx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (idx >= 0 && items[idx]) {
        e.preventDefault();
        items[idx].dispatchEvent(new MouseEvent('mousedown'));
      } else { close(); }
    } else if (e.key === 'Escape') { close(); }
  };
}

// ---------- lock ----------
//
// The state lives IN the switch, not here: if you lock them and the power
// fails, you do not want them unlocking themselves when it comes back. The
// panel only writes and reads back.
async function sendLock(payload, btn) {
  const original = btn ? btn.textContent.trim() : '';
  if (btn) { btn.disabled = true; btn.textContent = 'writing...'; }
  let j;
  try {
    j = await (await api('/api/lock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })).json();
  } catch (err) { j = { error: String(err) }; }
  if (btn) { btn.disabled = false; btn.textContent = original; }

  if (j.error) {
    setStatus(j.error, 'err');
    return false;
  }
  const bad = (j.results || []).filter(r => !r.ok);
  if (bad.length) {
    // We assume nothing about the ones that failed: we re-read everything, so
    // the UI does not show "locked" for a switch that never got the command.
    setStatus(`${bad.length} switch(es) did not answer`, 'warn');
  }
  const fresh = await (await api('/api/lock')).json();
  state.locks = fresh.bySwitch || {};
  render();
  return !bad.length;
}

function toggleLock(node, btn) {
  const cur = (state.locks[String(node)] || {}).locked;
  return sendLock({ switches: [node], locked: !cur }, btn);
}

function setLockAll(locked, btn) {
  return sendLock({ all: true, locked }, btn);
}

// ---------- what the bulbs are doing ----------
//
// Every other value the panel shows is one WE wrote, so it can be cached for
// hours and re-read on a whim. A bulb's on/off is the exception: the switch
// sends Toggle straight to the bulb over Thread and the Pi never sees it, so
// our copy is wrong within a second of anybody pressing a switch. The tiles
// show that state, so it has to be polled.
//
// Polling it forever would undo the work that got the Pi's idle load down: it
// keeps chip-tool thawed for as long as a tab is open somewhere. So the poll is
// tied to somebody ACTUALLY LOOKING, not to the page existing:
//
//   - the tab has to be visible;
//   - and touched within IDLE_MS. A panel left open on a wall tablet goes quiet
//     on its own, and wakes on the first touch with a forced read, so what you
//     see when you walk up to it is current and not four hours old.
//
// The server coalesces on its own (a read newer than its TTL is served from
// memory), so several browsers do not multiply the radio traffic.
const BULBS = { timer: null, lastTouch: Date.now(), idle: false };
const BULB_POLL_MS = 15000;
const BULB_IDLE_MS = 3 * 60 * 1000;

async function loadBulbs(fresh) {
  const d = state.devices || {};
  if (!(d.bulbs || []).length && !(d.devices || []).length) { return; }
  try {
    // Deliberately not through api(): a background read should not make the
    // logs' activity dot pulse. The dot means "you asked for something and
    // it has not come back yet".
    const j = await (await fetch('/api/bulbs' + (fresh ? '?fresh=1' : ''))).json();
    const fresh_ = j.byNode || {};
    // Asked before the new state lands, because it is a comparison against the
    // old one. This is the wall-switch path: nobody pressed anything here.
    const say = SHEET_SAY
      && tookoverNow(SHEET_SAY.node, (fresh_[String(SHEET_SAY.node)] || {}).on);
    noteReleases(state.bulbs || {}, fresh_);
    if (say) { delete TOOKOVER[String(SHEET_SAY.node)]; SHEET_SAY.say(); }
    state.bulbs = fresh_;
    render();
    // An open sheet used to be a snapshot: it only ever redrew from its own
    // commands, so a bulb changing underneath it - by the schedule, by the wall
    // switch - was invisible until you closed and opened it again.
    if (SHEET_LIVE) { SHEET_LIVE(); }
  } catch (err) {
    /* We try again on the next tick; a missed poll is not worth a red banner. */
  }
}

function pollBulbs() {
  clearTimeout(BULBS.timer);
  BULBS.timer = setTimeout(() => {
    const idle = document.hidden || (Date.now() - BULBS.lastTouch) > BULB_IDLE_MS;
    BULBS.idle = idle;
    if (!idle) { loadBulbs(); }
    pollBulbs();
  }, BULB_POLL_MS);
}

function touched() {
  const wasIdle = BULBS.idle || document.hidden;
  BULBS.lastTouch = Date.now();
  // Coming back from idle, do not wait out a poll interval and do not accept
  // the server's cache either: what is on screen has had time to go stale.
  if (wasIdle) { BULBS.idle = false; loadBulbs(true); }
}

['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, touched, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { touched(); } });
window.addEventListener('focus', touched);
pollBulbs();

// ---------- logs ----------
//
// The panel has no streaming channel to the browser, so progress is read by
// polling a ring buffer on the server. While a command is in flight we ask
// often, otherwise rarely - a panel left open on a tablet should not hammer the
// Pi ten times a second for nothing.
const LOGS = { since: 0, open: false, unseen: 0, busy: 0, timer: null };

function markBusy(delta) {
  LOGS.busy = Math.max(0, LOGS.busy + delta);
  $('#logs').classList.toggle('busy', LOGS.busy > 0);
  scheduleLogPoll();
}

// Every fetch to the API goes through here, so the activity dot stays correct
// without marking it by hand at every call.
async function api(url, opts) {
  markBusy(+1);
  try {
    return await fetch(url, opts);
  } finally {
    markBusy(-1);
    pollLog();          // picks up whatever was logged during the call
  }
}

function scheduleLogPoll() {
  clearTimeout(LOGS.timer);
  const every = LOGS.busy > 0 ? 900 : (LOGS.open ? 2500 : 8000);
  LOGS.timer = setTimeout(pollLog, every);
}

async function pollLog() {
  let j;
  try {
    j = await (await fetch('/api/log?since=' + LOGS.since)).json();
  } catch (err) {
    scheduleLogPoll();
    return;
  }
  if (j.lines && j.lines.length) {
    appendLog(j.lines);
    LOGS.since = j.next;
  }

  // The server holds the device state and re-reads it in the background. We do
  // not care THAT it read - only whether something came back different from
  // what we are showing. The counter goes up only when a value actually
  // differs, and it rides along on the log request, which happens anyway. Zero
  // extra requests.
  if (typeof j.rev === 'number') {
    if (STATE_REV === null) {
      STATE_REV = j.rev;
    } else if (j.rev !== STATE_REV) {
      STATE_REV = j.rev;
      reloadState();
    }
  }
  scheduleLogPoll();
}

// The last state revision we are showing. null = we have not seen one yet.
let STATE_REV = null;

async function reloadState() {
  try {
    const [b, l] = await Promise.all([
      (await api('/api/bindings')).json(),
      (await api('/api/lock')).json(),
    ]);
    state.bySwitch = b.bySwitch || {};
    state.locks = l.bySwitch || {};
    render();
  } catch (err) {
    /* We retry on the next revision; no reason to alarm anyone over this. */
  }
}

function appendLog(lines) {
  const body = $('#logs .body');
  const empty = body.querySelector('.empty-log');
  if (empty) { empty.remove(); }

  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 30;
  for (const l of lines) {
    const d = document.createElement('div');
    d.className = 'line ' + (l.level || 'info');
    const t = new Date(l.t * 1000);
    d.innerHTML = `<span class="ts">${String(t.getHours()).padStart(2, '0')}:` +
                  `${String(t.getMinutes()).padStart(2, '0')}:` +
                  `${String(t.getSeconds()).padStart(2, '0')}</span><span></span>`;
    d.lastChild.textContent = l.msg;
    body.append(d);
  }
  // Do not drag the user back down if they scrolled up to read something.
  if (atBottom) { body.scrollTop = body.scrollHeight; }

  while (body.children.length > 400) { body.firstChild.remove(); }

  if (!LOGS.open) {
    LOGS.unseen += lines.length;
    $('#logs .badge').textContent = LOGS.unseen + ' new lines';
  }
}

$('#logs .bar').onclick = () => {
  LOGS.open = !LOGS.open;
  $('#logs').classList.toggle('open', LOGS.open);
  if (LOGS.open) {
    LOGS.unseen = 0;
    $('#logs .badge').textContent = '';
    const body = $('#logs .body');
    body.scrollTop = body.scrollHeight;
  }
  scheduleLogPoll();
};
pollLog();

// The theme selector. The applying itself lives in the script in <head>, which
// runs before the first paint; here we only cycle and draw the icon.
// The icon shows the PREFERENCE (auto included), not the effective theme -
// otherwise on auto you would have no way to see that it is on auto.
const THEME_CYCLE = [
  { pref: 'auto',  name: 'auto, follows the computer' },
  { pref: 'light', name: 'day' },
  { pref: 'dark',  name: 'night' },
];

function paintTheme() {
  const btn = $('#theme button');
  let i = THEME_CYCLE.findIndex(t => t.pref === window.themePref());
  if (i < 0) { i = 0; }
  const next = THEME_CYCLE[(i + 1) % THEME_CYCLE.length];

  btn.dataset.state = THEME_CYCLE[i].pref;
  // No visible text, so the label has to say both the state and what comes next.
  const label = `theme: ${THEME_CYCLE[i].name} — click for ${next.name}`;
  btn.setAttribute('aria-label', label);
  btn.title = label;
}

$('#go-home').onclick = goHome;
$('#go-add').onclick = addAnything;
$('#go-sched').onclick = () => editSchedule();

$('#theme button').onclick = () => {
  const i = THEME_CYCLE.findIndex(t => t.pref === window.themePref());
  window.setThemePref(THEME_CYCLE[((i < 0 ? 0 : i) + 1) % THEME_CYCLE.length].pref);
  paintTheme();
  // The chart's gradients are baked into the svg when it is drawn, so a theme
  // change under an open schedule would leave the old palette on screen.
  if ($('#chart')) { drawChart(); }
};
paintTheme();

load();
</script>
</body>
</html>
